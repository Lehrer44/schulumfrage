<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchulUmfrage – Lehrer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>:root{--bg:#0b1020;--panel:#151c31;--panel2:#1c2640;--text:#f5f7ff;--muted:#9aa6c4;--accent:#7c5cff;--ok:#35d39a;--danger:#ff5d73;--line:#2b3757}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#111a31 55%,#17112d);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:var(--panel2)}button.danger{background:var(--danger)}button.ghost{background:transparent;border:1px solid var(--line)}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0f1628;color:var(--text)}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.brand{font-size:26px;font-weight:900}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}.panel{background:rgba(21,28,49,.92);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 15px 50px #0004}.list{display:grid;gap:10px}.survey{padding:14px;border:1px solid var(--line);border-radius:13px;background:#11182b}.survey.active{outline:2px solid var(--accent)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.actions{display:flex;gap:7px;margin-top:10px}.slides{display:grid;gap:12px}.slide{border:1px solid var(--line);border-radius:15px;padding:15px;background:#10172a}.slidehead{display:flex;justify-content:space-between;align-items:center}.tag{padding:5px 8px;border-radius:999px;background:#2a2150;color:#c8beff;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.answer{padding:14px;border:1px solid var(--line);border-radius:12px;background:#10172a}.bar{height:9px;border-radius:99px;background:#293451;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.login{max-width:430px;margin:10vh auto}.hidden{display:none!important}.qr{background:white;padding:15px;border-radius:15px;width:max-content}.media{max-width:100%;max-height:180px;border-radius:12px;margin-top:10px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.modalbox{max-width:760px;width:100%;max-height:90vh;overflow:auto}.notice{padding:10px 12px;border-radius:10px;background:#18223a;margin:10px 0}.ok{color:var(--ok)}@media(max-width:850px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.wrap{padding:15px}}</style></head><body>
<div id="login" class="login panel"><h1>SchulUmfrage</h1><p class="muted">Lehrerbereich</p><input id="email" type="email" placeholder="E-Mail"><br><br><input id="password" type="password" placeholder="Passwort"><br><br><button id="loginBtn">Anmelden</button><div id="loginMsg" class="notice hidden"></div></div>
<div id="app" class="hidden"><div class="wrap"><div class="top"><div><div class="brand">SchulUmfrage</div><div class="muted">Lehrerbereich · Umfragen & Live-Moderation</div></div><button class="secondary" id="logout">Abmelden</button></div>
<div class="grid"><aside class="panel"><div class="row"><h2>Umfragen</h2><button id="newSurvey">＋</button></div><div id="surveyList" class="list"></div></aside><main><section id="editor" class="panel"><div class="row"><div><h2 id="editorTitle">Neue Umfrage</h2><div class="muted">Editor</div></div><button id="saveSurvey">Speichern</button></div><br><input id="surveyName" placeholder="Name der Umfrage"><br><br><div id="slides" class="slides"></div><br><button class="secondary" id="addSlide">＋ Folie hinzufügen</button></section><br><section id="live" class="panel"><div class="row"><div><h2>Live-Moderation</h2><div id="liveStatus" class="muted">Keine Umfrage gestartet.</div></div><button id="startLive">Umfrage starten</button></div><div id="liveBody"></div></section></main></div></div></div>
<div id="modal" class="modal hidden"><div class="modalbox panel"><div class="row"><h2 id="modalTitle">Umfrage</h2><button class="ghost" id="closeModal">Schließen</button></div><div id="modalBody"></div></div></div>
<script>
const SUPABASE_URL='https://mqtcwiiawmuxrpkjfrfc.supabase.co';const SUPABASE_KEY='sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,surveys=[],current=null,session=null,sub=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES={mc:'Multiple-Choice',word:'Wortwolke',open:'Offene Frage',scale:'Skala',rank:'Ranking',qa:'Q&A',pin:'Pin setzen'};
async function init(){const {data:{session:s}}=await db.auth.getSession();if(s){user=s.user;showApp();loadSurveys()}else showLogin();db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;user?(showApp(),loadSurveys()):showLogin()})}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent=error.message;$('loginMsg').classList.remove('hidden')}};$('logout').onclick=()=>db.auth.signOut();
async function loadSurveys(){const {data,error}=await db.from('surveys').select('*').order('updated_at',{ascending:false});if(error)return alert(error.message);surveys=data||[];renderSurveyList();if(!current&&surveys[0])selectSurvey(surveys[0].id)}
function renderSurveyList(){$('surveyList').innerHTML=surveys.map(s=>`<div class="survey ${current?.id===s.id?'active':''}"><b>${esc(s.name)}</b><div class="muted">${s.slides.length} Folien</div><div class="actions"><button onclick="selectSurvey('${s.id}')">Bearbeiten</button><button class="secondary" onclick="openStart('${s.id}')">Starten</button><button class="danger" onclick="deleteSurvey('${s.id}')">Löschen</button></div></div>`).join('')||'<div class="muted">Noch keine Umfragen.</div>'}
function selectSurvey(id){current=structuredClone(surveys.find(s=>s.id===id));$('surveyName').value=current.name;$('editorTitle').textContent='Umfrage bearbeiten';renderSlides();renderSurveyList()}
$('newSurvey').onclick=()=>{current={id:null,name:'Neue Umfrage',slides:[newSlide()]};$('surveyName').value=current.name;$('editorTitle').textContent='Neue Umfrage';renderSlides();renderSurveyList()};
function newSlide(){return {type:'mc',question:'Neue Frage',options:['Option 1','Option 2'],media:null}};
function renderSlides(){$('slides').innerHTML=(current?.slides||[]).map((s,i)=>`<div class="slide"><div class="slidehead"><b>Folie ${i+1}</b><span class="tag">${TYPES[s.type]}</span></div><br><div class="two"><input data-i="${i}" data-k="question" value="${esc(s.question)}" placeholder="Frage"><select data-i="${i}" data-k="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${s.type===k?'selected':''}>${v}</option>`).join('')}</select></div><div id="opts${i}" style="margin-top:10px">${renderOptions(s,i)}</div><div class="actions"><label class="secondary" style="padding:10px 13px;border-radius:12px;cursor:pointer">📎 Medien<input type="file" accept="image/*,audio/*,video/*" data-media="${i}" style="display:none"></label><button class="danger" onclick="removeSlide(${i})">Folie löschen</button></div>${s.media?`<div class="notice">Medium: ${esc(s.media.name||'Datei')} <button class="ghost" onclick="current.slides[${i}].media=null;renderSlides()">Entfernen</button></div>`:''}</div>`).join('');document.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{current.slides[+el.dataset.i][el.dataset.k]=el.value});document.querySelectorAll('select[data-k]').forEach(el=>el.onchange=()=>{current.slides[+el.dataset.i].type=el.value;renderSlides()});document.querySelectorAll('[data-media]').forEach(el=>el.onchange=async()=>{const f=el.files[0];if(!f)return;current.slides[+el.dataset.media].media=await uploadMedia(f);renderSlides()})}
function renderOptions(s,i){if(s.type!=='mc'&&s.type!=='rank')return s.type==='scale'?'<div class="two"><input type="number" data-scale-min value="1"><input type="number" data-scale-max value="5"></div>':'<div class="notice muted">Diese Folie benötigt keine Antwortoptionen.</div>';return `<div class="list">${(s.options||[]).map((o,j)=>`<div class="row"><input value="${esc(o)}" data-opt="${i}:${j}"><button class="danger" onclick="current.slides[${i}].options.splice(${j},1);renderSlides()">×</button></div>`).join('')}<button class="secondary" onclick="current.slides[${i}].options.push('Neue Option');renderSlides()">＋ Option</button></div>`}
$('addSlide').onclick=()=>{current.slides.push(newSlide());renderSlides()};function removeSlide(i){current.slides.splice(i,1);renderSlides()}
document.addEventListener('input',e=>{if(e.target.dataset.opt){const [i,j]=e.target.dataset.opt.split(':').map(Number);current.slides[i].options[j]=e.target.value}});
async function uploadMedia(file){const path=`${user.id}/${crypto.randomUUID()}-${file.name.replace(/[^\w.\-]/g,'_')}`;const {error}=await db.storage.from('survey-media').upload(path,file,{upsert:false});if(error){alert(error.message);return null}const {data}=db.storage.from('survey-media').getPublicUrl(path);return {name:file.name,type:file.type,url:data.publicUrl}}
$('saveSurvey').onclick=async()=>{current.name=$('surveyName').value.trim()||'Unbenannte Umfrage';const payload={name:current.name,slides:current.slides,owner_id:user.id};let r=current.id?await db.from('surveys').update(payload).eq('id',current.id).select().single():await db.from('surveys').insert(payload).select().single();if(r.error)return alert(r.error.message);current=r.data;await loadSurveys();selectSurvey(current.id)};
async function deleteSurvey(id){if(!confirm('Umfrage wirklich löschen?'))return;const {error}=await db.from('surveys').delete().eq('id',id);if(error)alert(error.message);else{current=null;await loadSurveys();$('editorTitle').textContent='Neue Umfrage';$('slides').innerHTML=''}}
function openStart(id){current=surveys.find(s=>s.id===id);$('modalTitle').textContent='Umfrage starten';$('modalBody').innerHTML=`<div class="notice">Die Schüler öffnen <b>${esc(location.href.replace('teacher.html','student.html'))}</b> und geben den Code ein.</div><button onclick="createSession('${id}')">Session erstellen</button>`;$('modal').classList.remove('hidden')}
$('closeModal').onclick=()=>{$('modal').classList.add('hidden')};
async function createSession(id){const s=surveys.find(x=>x.id===id);const code=Math.random().toString(36).slice(2,7).toUpperCase();const {data,error}=await db.from('sessions').insert({survey_id:id,owner_id:user.id,title:s.name,survey_snapshot:s.slides,status:'lobby',current_slide:0,join_code:code}).select().single();if(error)return alert(error.message);session=data;$('modal').classList.add('hidden');renderLive();subscribeSession()}
$('startLive').onclick=async()=>{if(!session)return alert('Erst eine Session erstellen.');const {data,error}=await db.from('sessions').update({status:'running',current_slide:0,started_at:new Date().toISOString()}).eq('id',session.id).select().single();if(error)return alert(error.message);session=data;renderLive()};
function subscribeSession(){if(sub)sub.unsubscribe();sub=db.channel('session-'+session.id).on('postgres_changes',{event:'*',schema:'public',table:'sessions',filter:`id=eq.${session.id}`},p=>{session=p.new;renderLive()}).on('postgres_changes',{event:'*',schema:'public',table:'participants',filter:`session_id=eq.${session.id}`},()=>renderLive()).on('postgres_changes',{event:'*',schema:'public',table:'responses',filter:`session_id=eq.${session.id}`},()=>renderLive()).subscribe();renderLive()}
async function renderLive(){if(!session){$('liveStatus').textContent='Keine Umfrage gestartet.';return}const [{data:ps},{data:rs}]=await Promise.all([db.from('participants').select('*').eq('session_id',session.id),db.from('responses').select('*').eq('session_id',session.id).eq('slide_index',session.current_slide)]);const slide=session.survey_snapshot[session.current_slide];$('liveStatus').innerHTML=`Code <b>${session.join_code}</b> · ${session.status} · Folie ${session.current_slide+1}/${session.survey_snapshot.length} · ${ps?.length||0} Teilnehmer`;$('liveBody').innerHTML=`<div class="row" style="margin:15px 0"><button onclick="prevSlide()" class="secondary">← Zurück</button><button onclick="nextSlide()">Weiter →</button><button onclick="restartSession()" class="ghost">Neu starten</button></div><div class="notice"><b>${esc(slide?.question||'')}</b></div>${slide?.media?.url?mediaHtml(slide.media):''}<div class="answers">${(rs||[]).map(r=>`<div class="answer"><b>${esc(ps?.find(p=>p.id===r.participant_id)?.name||'Teilnehmer')}</b><div>${esc(JSON.stringify(r.answer))}</div></div>`).join('')||'<div class="muted">Noch keine Antworten.</div>'}</div>`}
function mediaHtml(m){return m.type.startsWith('image/')?`<img class="media" src="${m.url}">`:m.type.startsWith('video/')?`<video class="media" controls src="${m.url}"></video>`:`<audio controls src="${m.url}"></audio>`}
async function nextSlide(){if(!session)return;if(session.current_slide>=session.survey_snapshot.length-1)return;await db.from('sessions').update({current_slide:session.current_slide+1}).eq('id',session.id)}async function prevSlide(){if(session.current_slide<=0)return;await db.from('sessions').update({current_slide:session.current_slide-1}).eq('id',session.id)}async function restartSession(){if(!session)return;await db.from('responses').delete().eq('session_id',session.id);await db.from('sessions').update({status:'lobby',current_slide:0}).eq('id',session.id)}
init();
</script></body></html>
