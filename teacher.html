<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchulUmfrage – Lehrerbereich</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f1efe6;--line:#93856a;--text:#5c5547;--muted:#90836b;--danger:#ef726b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(520px,100%);border:2px solid var(--line);border-radius:26px;padding:30px;background:rgba(246,244,236,.25)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#ddd6c4;color:var(--muted);font-size:11px;font-weight:700}
h1{font-size:34px;font-weight:500;margin:13px 0 8px;color:var(--muted)}.muted{color:var(--muted)}
.field{display:grid;gap:7px;margin:15px 0}.field input{width:100%;border:2px solid var(--line);background:rgba(246,244,236,.56);color:var(--text);border-radius:8px;padding:13px;font:inherit}
.btn{width:100%;border:2px solid var(--line);border-radius:8px;background:rgba(246,244,236,.56);color:var(--muted);font:inherit;font-weight:600;padding:13px 16px;cursor:pointer}.btn:hover{background:#e9e5d8;color:#6e624e}
.msg{min-height:24px;color:var(--danger)}
</style>
</head>
<body>
<main class="wrap">
<section class="login">
<span class="badge">GESCHÜTZTER LEHRERBEREICH</span>
<h1>Anmelden</h1>
<p class="muted">Melde dich mit deinem Supabase-Lehrerkonto an.</p>
<form id="loginForm">
<div class="field"><label for="email">E-Mail</label><input autocomplete="username" id="email" required type="email"></div>
<div class="field"><label for="password">Passwort</label><input autocomplete="current-password" id="password" required type="password"></div>
<button class="btn" type="submit">Anmelden</button>
</form>
<p class="msg" id="loginMsg"></p>
</section>
</main>
<script>
const SUPABASE_URL='https://mqtcwiiawmuxrpkjfrfc.supabase.co';
const SUPABASE_KEY='sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
$('loginForm').onsubmit=async e=>{
 e.preventDefault();$('loginMsg').textContent='Anmeldung …';
 const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 if(error){$('loginMsg').textContent=error.message;return}
 window.location.href='dashboard.html';
};
(async()=>{
 const {data}=await db.auth.getSession();
 if(data.session)window.location.href='dashboard.html';
})();
</script>
</body>
</html>
