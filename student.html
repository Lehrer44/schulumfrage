<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchulUmfrage – Schüler</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0b1020;--panel:#151c31;--text:#f5f7ff;--muted:#9aa6c4;--accent:#7c5cff;--line:#2b3757}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1d2850,#0b1020 60%);color:var(--text);font:16px system-ui,sans-serif}.wrap{max-width:650px;margin:auto;padding:24px}.panel{background:#151c31ee;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 20px 70px #0005}.brand{font-size:28px;font-weight:900;margin-bottom:5px}.muted{color:var(--muted)}input,textarea,button{font:inherit;width:100%;padding:14px;border-radius:13px;border:1px solid var(--line)}input,textarea{background:#0e1527;color:var(--text)}button{background:var(--accent);color:#fff;border:0;font-weight:800;cursor:pointer}.option{background:#11182b;margin:9px 0;text-align:left}.option.selected{outline:3px solid var(--accent)}.hidden{display:none!important}.media{max-width:100%;max-height:260px;border-radius:14px;margin:15px 0}.ok{padding:15px;border-radius:13px;background:#18362f}.error{padding:12px;border-radius:12px;background:#42202a}.scale{display:flex;gap:7px;flex-wrap:wrap}.scale button{width:55px}.rank{display:grid;gap:8px}.rank div{padding:13px;background:#11182b;border-radius:12px;cursor:grab}</style></head><body><div class="wrap"><div class="panel"><div class="brand">SchulUmfrage</div><div class="muted">Teilnahme</div><section id="join"><br><input id="code" placeholder="Session-Code" autocomplete="off"><br><br><input id="name" placeholder="Dein Name" autocomplete="off"><br><br><button id="joinBtn">Beitreten</button><div id="msg"></div></section><section id="question" class="hidden"><div id="qtop" class="muted"></div><h1 id="q"></h1><div id="media"></div><div id="answer"></div><br><button id="send">Antwort absenden</button><div id="sent"></div></section></div></div><script>
const db=supabase.createClient('https://mqtcwiiawmuxrpkjfrfc.supabase.co','sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-');let session=null,participant=null,choice=null,channel=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('joinBtn').onclick=join;async function join(){const code=$('code').value.trim().toUpperCase(),name=$('name').value.trim();if(!code||!name)return show('Bitte Code und Namen eingeben.','error');const {data,error}=await db.from('sessions').select('*').eq('join_code',code).eq('status','lobby').maybeSingle();if(error||!data)return show('Session nicht gefunden oder bereits gestartet.','error');session=data;const r=await db.from('participants').insert({session_id:session.id,name}).select().single();if(r.error)return show(r.error.message,'error');participant=r.data;session={...data};$('join').classList.add('hidden');$('question').classList.remove('hidden');subscribe();render()}
function show(t,c=''){ $('msg').className=c; $('msg').textContent=t}
function subscribe(){channel=db.channel('student-'+session.id).on('postgres_changes',{event:'*',schema:'public',table:'sessions',filter:`id=eq.${session.id}`},p=>{session=p.new;render()}).subscribe()}
function render(){if(session.status!=='running'){$('qtop').textContent='Warte auf die Lehrkraft …';$('q').textContent=session.status==='ended'?'Die Umfrage ist beendet.':'Die nächste Folie wird gleich gestartet.';$('answer').innerHTML='';$('send').classList.add('hidden');return}const s=session.survey_snapshot[session.current_slide];$('qtop').textContent=`Folie ${session.current_slide+1} von ${session.survey_snapshot.length}`;$('q').textContent=s.question;$('send').classList.remove('hidden');$('sent').textContent='';$('media').innerHTML=s.media?mediaHtml(s.media):'';choice=null;renderInput(s)}
function mediaHtml(m){return m.type.startsWith('image/')?`<img class="media" src="${m.url}">`:m.type.startsWith('video/')?`<video class="media" controls src="${m.url}"></video>`:`<audio controls src="${m.url}"></audio>`}
function renderInput(s){const a=$('answer');if(s.type==='mc'){a.innerHTML=(s.options||[]).map((o,i)=>`<button class="option" data-i="${i}">${esc(o)}</button>`).join('');a.querySelectorAll('button').forEach(b=>b.onclick=()=>{choice=s.options[+b.dataset.i];a.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}else if(s.type==='word'||s.type==='open'||s.type==='qa'){a.innerHTML=`<textarea id="textAnswer" rows="5" placeholder="Deine Antwort …"></textarea>`}else if(s.type==='scale'){a.innerHTML='<div class="scale">'+Array.from({length:5},(_,i)=>`<button data-v="${i+1}">${i+1}</button>`).join('')+'</div>';a.querySelectorAll('button').forEach(b=>b.onclick=()=>{choice=b.dataset.v;a.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}else if(s.type==='rank'){a.innerHTML='<div class="rank">'+(s.options||[]).map((o,i)=>`<div draggable="true" data-i="${i}">${i+1}. ${esc(o)}</div>`).join('')+'</div>'}else if(s.type==='pin'){a.innerHTML='<input id="pin" placeholder="Ort / Punkt beschreiben">'}else a.innerHTML='<div class="muted">Keine Eingabe erforderlich.</div>'}
$('send').onclick=async()=>{if(!session||session.status!=='running')return;const s=session.survey_snapshot[session.current_slide];let answer=choice;if(['open','word','qa'].includes(s.type))answer=$('textAnswer')?.value.trim();if(s.type==='pin')answer=$('pin')?.value.trim();if(answer===null||answer===undefined||answer==='')return show('Bitte zuerst antworten.','error');const {error}=await db.from('responses').upsert({session_id:session.id,participant_id:participant.id,slide_index:session.current_slide,answer},{onConflict:'session_id,participant_id,slide_index'});if(error)return show(error.message,'error');$('sent').className='ok';$('sent').textContent='Antwort gespeichert ✓';$('send').disabled=true};
</script></body></html>
