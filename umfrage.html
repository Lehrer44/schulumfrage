<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchulUmfrage – Umfrage bearbeiten</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f1efe6;--line:#93856a;--text:#5c5547;--muted:#90836b;--accent:#918469;--accent-dark:#6e624e;--danger:#ef726b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.title{font-size:28px;font-weight:500;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:2px solid var(--line);border-radius:8px;background:rgba(246,244,236,.56);color:var(--muted);font:inherit;font-weight:600;padding:9px 14px;cursor:pointer}.btn:hover{background:#e9e5d8;color:var(--accent-dark)}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.panel{border:2px solid var(--line);border-radius:20px;padding:22px;background:rgba(246,244,236,.18)}.field{display:grid;gap:7px;margin:0 0 18px}.field input,.field select,.field textarea{width:100%;border:2px solid var(--line);background:rgba(246,244,236,.56);color:var(--text);border-radius:8px;padding:11px 12px;font:inherit}.field textarea{resize:vertical}.slides{display:grid;gap:14px}.slide{border:2px solid var(--line);border-radius:13px;padding:16px;background:rgba(247,244,234,.5)}.slideHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.slideNumber{font-weight:700;color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:11px}.subtle{font-size:13px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;right:18px;bottom:18px;background:#efebe0;border:2px solid var(--line);border-radius:10px;padding:12px 15px;max-width:420px}.hidden{display:none!important}
@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div class="title">Umfrage <span id="modeText">erstellen</span></div>
<div class="actions"><button class="btn" id="backBtn">← Übersicht</button><button class="btn" id="saveBtn">Speichern</button><button class="btn accent" id="startBtn" disabled>▶ Starten</button></div>
</header>
<section class="panel">
<div class="field"><label for="surveyName">Name der Umfrage</label><input id="surveyName" maxlength="120" placeholder="z. B. Fußball-Quiz"></div>
<div class="slides" id="slides"></div>
<div class="actions" style="margin-top:14px"><button class="btn" id="addSlideBtn">＋ Folie hinzufügen</button></div>
</section>
</div>
<div class="toast hidden" id="toast"></div>
<script>
const SUPABASE_URL='https://mqtcwiiawmuxrpkjfrfc.supabase.co';
const SUPABASE_KEY='sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const types=['Multiple-Choice','Wortwolke','Offene Frage','Skala','Ranking','Q&A','Pin setzen'];
let currentSurvey=null,createdNew=false;
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function requireUser(){const {data,error}=await db.auth.getUser();if(error||!data.user){window.location.href='teacher.html';return null}return data.user}
function newSlide(){return {type:'Multiple-Choice',question:'Neue Frage',options:['Option 1','Option 2']}}
async function load(){const user=await requireUser();if(!user)return;const id=new URLSearchParams(location.search).get('id');if(id){const {data,error}=await db.from('surveys').select('*').eq('id',id).single();if(error||!data){toast('Umfrage konnte nicht geladen werden.');setTimeout(()=>location.href='dashboard.html',900);return}currentSurvey=data;$('modeText').textContent='bearbeiten';$('surveyName').value=data.name;renderSlides(data.slides||[])}else{$('modeText').textContent='erstellen';createdNew=true;$('surveyName').value='Neue Umfrage';renderSlides([newSlide()])}}
function renderSlides(slides){$('slides').innerHTML='';(slides.length?slides:[newSlide()]).forEach(addSlide)}
function addSlide(slide=newSlide()){const e=document.createElement('article');e.className='slide';e.innerHTML='<div class="slideHead"><div class="slideNumber"></div><button type="button" class="btn danger remove">Entfernen</button></div><div class="field" style="margin-top:14px"><label>Art der Umfrage</label><select class="type">'+types.map(t=>'<option>'+esc(t)+'</option>').join('')+'</select></div><div class="field"><label>Frage / Überschrift</label><textarea class="question" rows="2"></textarea></div><div class="field optionsField"><label class="optionsLabel">Antwortoptionen (eine pro Zeile)</label><textarea class="options" rows="4"></textarea><div class="subtle optionsHint"></div></div>';e.querySelector('.type').value=slide.type||types[0];e.querySelector('.question').value=slide.question||'';e.querySelector('.options').value=(slide.options||[]).join('\n');const type=e.querySelector('.type');const optionsField=e.querySelector('.optionsField');const label=e.querySelector('.optionsLabel');const hint=e.querySelector('.optionsHint');const updateType=()=>{const t=type.value;if(t==='Skala'){label.textContent='Skalenbeschriftungen (optional, eine pro Zeile)';hint.textContent='Leer = 5 Stufen; sonst entspricht jede Zeile einer Stufe.'}else if(t==='Ranking'){label.textContent='Ranking-Elemente (eine pro Zeile)';hint.textContent='Die Schüler bringen diese Elemente in eine Reihenfolge.'}else if(t==='Pin setzen'){label.textContent='Optionen';hint.textContent='Die Schüler setzen einen Punkt auf einer Fläche.'}else{label.textContent='Antwortoptionen (eine pro Zeile)';hint.textContent='Jede Zeile ist eine auswählbare Antwort.'}optionsField.classList.toggle('hidden',t==='Offene Frage'||t==='Q&A'||t==='Wortwolke'||t==='Pin setzen')};type.onchange=updateType;updateType();e.querySelector('.remove').onclick=()=>{e.remove();renumber()};$('slides').appendChild(e);renumber()}
function renumber(){[...$('slides').children].forEach((e,i)=>e.querySelector('.slideNumber').textContent='Folie '+(i+1))}
function collectSlides(){return [...$('slides').children].map(e=>({type:e.querySelector('.type').value,question:e.querySelector('.question').value.trim(),options:e.querySelector('.options').value.split('\n').map(v=>v.trim()).filter(Boolean)}))}
async function save(){const user=await requireUser();if(!user)return;const name=$('surveyName').value.trim()||'Unbenannte Umfrage',slides=collectSlides();if(!slides.length){toast('Bitte mindestens eine Folie anlegen.');return}if(!currentSurvey){const {data,error}=await db.from('surveys').insert({owner_id:user.id,name,slides}).select().single();if(error){toast('Erstellen fehlgeschlagen: '+error.message);return}currentSurvey=data;createdNew=false;history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(data.id));$('modeText').textContent='bearbeiten';$('startBtn').disabled=false;toast('Umfrage gespeichert.');return}const {data,error}=await db.from('surveys').update({name,slides,updated_at:new Date().toISOString()}).eq('id',currentSurvey.id).select().single();if(error){toast('Speichern fehlgeschlagen: '+error.message);return}currentSurvey=data;$('startBtn').disabled=false;toast('Umfrage gespeichert.')}
async function start(){if(!currentSurvey){toast('Bitte zuerst speichern.');return}const user=await requireUser();if(!user)return;const join_code=Math.random().toString(36).slice(2,7).toUpperCase();const {data,error}=await db.from('sessions').insert({survey_id:currentSurvey.id,owner_id:user.id,title:currentSurvey.name,survey_snapshot:currentSurvey.slides,status:'lobby',current_slide:0,join_code}).select().single();if(error){toast('Session konnte nicht gestartet werden: '+error.message);return}const {data:running,error:runError}=await db.from('sessions').update({status:'running',started_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',data.id).select().single();if(runError){toast('Session konnte nicht gestartet werden: '+runError.message);return}window.location.href='umfrage-live.html?id='+encodeURIComponent(running.id)}
$('backBtn').onclick=()=>location.href='dashboard.html';$('addSlideBtn').onclick=()=>addSlide();$('saveBtn').onclick=save;$('startBtn').onclick=start;
load();
</script>
</body>
</html>
