<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchulUmfrage – Umfrage bearbeiten</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f1efe6;--surface:#f7f4ea;--line:#93856a;--line-soft:#c6bdab;--text:#5c5547;--muted:#90836b;--accent:#918469;--accent-dark:#6e624e;--danger:#ef726b;--ok:#22a867}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.wrap{max-width:1380px;margin:0 auto;padding:22px 18px 38px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
.title{font-size:28px;font-weight:500;color:var(--muted)}.subtle{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:2px solid var(--line);border-radius:8px;background:rgba(246,244,236,.6);color:var(--muted);font:inherit;font-weight:600;padding:9px 13px;cursor:pointer;transition:.15s}.btn:hover{background:#e9e5d8;color:var(--accent-dark)}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}.panel{border:2px solid var(--line);border-radius:20px;background:rgba(246,244,236,.18)}
.slidesPanel{padding:14px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panelHead h2{margin:0;color:var(--muted);font-size:23px;font-weight:500}.addSlide{width:38px;height:38px;padding:0;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:23px}
.slideList{display:grid;gap:9px}.slideCard{border:2px solid var(--line);border-radius:12px;padding:11px;background:rgba(247,244,234,.52);cursor:pointer;transition:.15s}.slideCard:hover{background:#ebe7d8}.slideCard.selected{outline:2px solid var(--accent);outline-offset:1px;background:#e9e5d8}.slideTop{display:flex;align-items:center;justify-content:space-between;gap:8px}.slideNo{font-size:13px;font-weight:800;color:var(--muted)}.slideType{font-size:11px;font-weight:700;padding:4px 7px;border-radius:999px;background:#ddd6c4;color:var(--muted)}.slideQuestion{margin-top:8px;font-weight:650;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.slideActions{display:flex;gap:5px;margin-top:9px}.slideActions .btn{padding:5px 8px;font-size:12px}
.editorPanel{padding:18px}.editorGrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:18px}.field{display:grid;gap:7px;margin:0 0 15px}.field label{font-size:14px;color:var(--muted);font-weight:600}.field input,.field textarea,.field select{width:100%;border:2px solid var(--line);background:rgba(246,244,236,.65);color:var(--text);border-radius:9px;padding:11px 12px;font:inherit}.field textarea{resize:vertical;min-height:90px}.surveyName{margin-bottom:18px}
.typePicker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:15px}.typeBtn{border:2px solid var(--line);border-radius:10px;background:rgba(246,244,236,.5);padding:10px 11px;text-align:left;cursor:pointer;color:var(--text)}.typeBtn strong{display:block;font-size:14px}.typeBtn span{display:block;font-size:11px;color:var(--muted);margin-top:2px}.typeBtn.selected{background:#e7e1d1;outline:2px solid var(--accent);outline-offset:-4px}
.settings{border:2px solid var(--line-soft);border-radius:13px;padding:13px;background:rgba(247,244,234,.4)}.settings h3{margin:0 0 10px;font-size:16px;color:var(--muted);font-weight:700}.settingsHint{font-size:12px;color:var(--muted);margin:-3px 0 9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mediaBox{border:2px solid var(--line-soft);border-radius:13px;padding:13px;margin-top:12px;background:rgba(247,244,234,.4)}.mediaHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.mediaHead strong{font-size:15px;color:var(--muted)}.mediaActions{display:flex;gap:7px;flex-wrap:wrap}.uploadBtn{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:8px;padding:8px 11px;background:rgba(246,244,236,.6);color:var(--muted);font-weight:600;cursor:pointer}.uploadBtn input{display:none}.mediaHint{font-size:12px;color:var(--muted);margin-top:8px}.mediaPreview{margin-top:10px;border:2px solid var(--line-soft);border-radius:10px;padding:8px;background:#fff;display:flex;justify-content:center}.mediaPreview img,.mediaPreview video{max-width:100%;max-height:260px;display:block;border-radius:6px}.mediaPreview audio{width:100%}.mediaName{font-size:12px;color:var(--muted);margin-top:7px;overflow-wrap:anywhere}.hidden{display:none!important}
.preview{border:2px solid var(--line);border-radius:16px;padding:16px;background:rgba(247,244,234,.52);min-height:430px}.previewHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.previewHead h2{margin:0;color:var(--muted);font-weight:500;font-size:21px}.previewStage{min-height:335px;border:2px solid var(--line-soft);border-radius:13px;padding:18px;background:#f7f4ea;display:flex;flex-direction:column;justify-content:center}.previewType{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}.previewQuestion{font-size:29px;line-height:1.23;color:var(--muted);margin:10px 0 16px}.previewOptions{display:grid;gap:8px}.previewOption{border:2px solid var(--line);border-radius:9px;padding:9px 11px;background:rgba(246,244,236,.65)}.previewText{height:76px;border:2px dashed var(--line-soft);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px}.previewScale{display:grid;gap:14px}.scalePreviewItem{border:2px solid var(--line-soft);border-radius:11px;padding:11px;background:rgba(246,244,236,.45)}.scaleStatement{font-weight:650;color:var(--text);margin-bottom:9px}.scalePreviewTrack{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.scalePreviewTrack span{font-size:12px;color:var(--muted)}.scalePreviewRange{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--line),var(--line-soft));position:relative}.scalePreviewThumb{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 5px rgba(70,60,40,.25)}.previewRank{display:grid;gap:7px}.previewRank div{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:8px}.previewRank b{color:var(--accent-dark)}.previewPin{height:210px;border:2px solid var(--line);border-radius:10px;background:#ece8dd;overflow:hidden;position:relative;display:grid;place-items:center;color:var(--muted);font-size:13px}.previewPin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.previewPinLabel{position:relative;z-index:1;padding:7px 10px;border-radius:8px;background:rgba(247,244,234,.9)}.saveHint{margin-top:10px;text-align:right;font-size:12px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;background:#efebe0;border:2px solid var(--line);border-radius:10px;padding:12px 15px;max-width:430px;z-index:20}
@media(max-width:1050px){.layout{grid-template-columns:280px minmax(0,1fr)}.editorGrid{grid-template-columns:1fr}.preview{order:-1}.previewStage{min-height:280px}}
@media(max-width:760px){.wrap{padding:16px 12px 28px}.top{align-items:flex-start;flex-direction:column}.top .actions{width:100%}.top .actions .btn{flex:1}.layout{grid-template-columns:1fr}.slidesPanel{position:static;max-height:none}.typePicker{grid-template-columns:1fr}.two{grid-template-columns:1fr}.previewQuestion{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="title">Umfrage <span id="modeText">erstellen</span></div>
<div class="subtle" id="saveState">Noch nicht gespeichert</div>
</div>
<div class="actions">
<button class="btn" id="backBtn">← Übersicht</button>
<button class="btn" id="saveBtn">Speichern</button>
<button class="btn accent" id="startBtn" disabled>▶ Starten</button>
</div>
</header>

<div class="layout">
<aside class="panel slidesPanel">
<div class="panelHead"><h2>Folien</h2><button class="addSlide" id="addSlideBtn" title="Neue Folie">＋</button></div>
<div class="slideList" id="slideList"></div>
</aside>

<main class="panel editorPanel">
<div class="field surveyName">
<label for="surveyName">Name der Umfrage</label>
<input id="surveyName" maxlength="120" placeholder="z. B. Meinungsumfrage">
</div>

<div class="editorGrid">
<section>
<div class="panelHead"><h2 style="margin:0;color:var(--muted);font-size:21px;font-weight:500">Folie bearbeiten</h2></div>
<div id="slideEditor"></div>
</section>

<section class="preview">
<div class="previewHead"><h2>Vorschau</h2><span class="subtle">So sehen Schüler die Folie.</span></div>
<div class="previewStage" id="previewStage"></div>
<div class="saveHint">Änderungen werden erst mit „Speichern“ in der Umfrage übernommen.</div>
</section>
</div>
</main>
</div>

<div class="toast hidden" id="toast"></div>

<script>
const SUPABASE_URL='https://mqtcwiiawmuxrpkjfrfc.supabase.co';
const SUPABASE_KEY='sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const types=[
 {id:'Multiple-Choice',title:'Multiple Choice',desc:'Eine Antwort auswählen'},
 {id:'Wortwolke',title:'Wortwolke',desc:'Ein Wort oder Begriff'},
 {id:'Offene Frage',title:'Offene Frage',desc:'Freie Texteingabe'},
 {id:'Skala',title:'Skala',desc:'Bewerten auf einer Skala'},
 {id:'Ranking',title:'Ranking',desc:'Reihenfolge festlegen'},
 {id:'Q&A',title:'Q&A',desc:'Frage oder kurzer Beitrag'},
 {id:'Pin setzen',title:'Pin setzen',desc:'Punkt auf einer Fläche'}
];
let currentSurvey=null;
let slides=[];
let activeSlide=0;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.add('hidden'),3400)}
function setSaveState(text){$('saveState').textContent=text}
function typeMeta(type){return types.find(x=>x.id===type)||types[0]}
function newSlide(){return {type:'Multiple-Choice',question:'Neue Frage',options:['Option 1','Option 2'],scaleMax:5,scaleItems:[{statement:'Neue Aussage',min:0,max:10}],media:null}}
function ensureSlideData(s){const base=newSlide();const merged=Object.assign(base,s||{});merged.options=Array.isArray(s?.options)?s.options.slice():base.options;merged.scaleItems=Array.isArray(s?.scaleItems)&&s.scaleItems.length?s.scaleItems.map(x=>({statement:x?.statement||'Aussage',min:Number.isFinite(Number(x?.min))?Number(x.min):0,max:Number.isFinite(Number(x?.max))?Number(x.max):10})):base.scaleItems;return merged}

async function requireUser(){
 const {data,error}=await db.auth.getUser();
 if(error||!data.user){location.href='teacher.html';return null}
 return data.user;
}

async function load(){
 const user=await requireUser();if(!user)return;
 const id=new URLSearchParams(location.search).get('id');
 if(id){
   const {data,error}=await db.from('surveys').select('*').eq('id',id).single();
   if(error||!data){toast('Umfrage konnte nicht geladen werden.');setTimeout(()=>location.href='dashboard.html',900);return}
   currentSurvey=data;
   slides=(data.slides||[]).map(ensureSlideData);
   $('modeText').textContent='bearbeiten';
   $('surveyName').value=data.name||'';
   $('startBtn').disabled=false;
   setSaveState('Gespeichert');
 }else{
   slides=[newSlide()];
   $('modeText').textContent='erstellen';
   $('surveyName').value='Neue Umfrage';
   setSaveState('Noch nicht gespeichert');
 }
 renderSlides();
 selectSlide(0);
}

function renderSlides(){
 const root=$('slideList');
 root.innerHTML='';
 slides.forEach((s,i)=>{
   const meta=typeMeta(s.type);
   const el=document.createElement('article');
   el.className='slideCard'+(i===activeSlide?' selected':'');
   el.innerHTML='<div class="slideTop"><span class="slideNo">Folie '+(i+1)+'</span><span class="slideType">'+esc(meta.title)+'</span></div>'+
     '<div class="slideQuestion">'+esc(s.question||'Ohne Frage')+'</div>'+
     '<div class="slideActions"><button class="btn up" type="button">↑</button><button class="btn down" type="button">↓</button><button class="btn danger remove" type="button">Löschen</button></div>';
   el.onclick=e=>{if(e.target.closest('button'))return;selectSlide(i)};
   el.querySelector('.up').onclick=e=>{e.stopPropagation();moveSlide(i,-1)};
   el.querySelector('.down').onclick=e=>{e.stopPropagation();moveSlide(i,1)};
   el.querySelector('.remove').onclick=e=>{e.stopPropagation();removeSlide(i)};
   el.querySelector('.up').disabled=i===0;
   el.querySelector('.down').disabled=i===slides.length-1;
   root.appendChild(el);
 });
}

function selectSlide(index){
 if(!slides.length){slides=[newSlide()];index=0}
 activeSlide=Math.max(0,Math.min(slides.length-1,index));
 renderSlides();renderEditor();renderPreview();
}

function moveSlide(index,dir){
 const to=index+dir;if(to<0||to>=slides.length)return;
 const temp=slides[index];slides[index]=slides[to];slides[to]=temp;
 activeSlide=to;renderSlides();renderEditor();renderPreview();
 setSaveState('Ungespeicherte Änderungen');
}

function removeSlide(index){
 if(slides.length===1){toast('Eine Umfrage braucht mindestens eine Folie.');return}
 if(!confirm('Folie '+(index+1)+' wirklich löschen?'))return;
 const removed=slides.splice(index,1)[0];
 if(removed?.media?.path){removeStorageObject(removed.media.path).catch(()=>{})}if(removed?.pinImage?.path){removeStorageObject(removed.pinImage.path).catch(()=>{})}
 activeSlide=Math.max(0,Math.min(activeSlide,slides.length-1));
 renderSlides();renderEditor();renderPreview();setSaveState('Ungespeicherte Änderungen');
}

function renderEditor(){
 const s=slides[activeSlide];if(!s)return;
 const root=$('slideEditor');root.innerHTML='';
 const wrap=document.createElement('div');

 const picker=document.createElement('div');picker.className='typePicker';
 types.forEach(t=>{
   const b=document.createElement('button');b.type='button';b.className='typeBtn'+(s.type===t.id?' selected':'');
   b.innerHTML='<strong>'+esc(t.title)+'</strong><span>'+esc(t.desc)+'</span>';
   b.onclick=()=>{s.type=t.id;renderSlides();renderEditor();renderPreview();setSaveState('Ungespeicherte Änderungen')};
   picker.appendChild(b);
 });
 wrap.appendChild(picker);

 const q=document.createElement('div');q.className='field';q.innerHTML='<label>Frage / Überschrift</label><textarea id="slideQuestion" rows="3" placeholder="Was sollen die Schüler beantworten?">'+esc(s.question||'')+'</textarea>';
 wrap.appendChild(q);

 q.querySelector('textarea').oninput=e=>{s.question=e.target.value;updateCardQuestion();renderPreview();setSaveState('Ungespeicherte Änderungen')};

 const settings=document.createElement('div');settings.className='settings';
 const meta=typeMeta(s.type);let html='<h3>'+esc(meta.title)+'</h3><div class="settingsHint">'+esc(meta.desc)+'</div>';

 if(s.type==='Multiple-Choice'){
   html+='<div class="field"><label>Antwortoptionen <span class="subtle">(eine pro Zeile)</span></label><textarea id="optionsField" rows="6">'+esc((s.options||[]).join('\n'))+'</textarea></div>';
 }else if(s.type==='Skala'){
   html+='<div class="settingsHint">Eine Folie kann mehrere Aussagen enthalten. Für jede Aussage werden Minimum und Maximum festgelegt.</div><div id="scaleItemsEditor"></div><button type="button" class="btn" id="addScaleItem">＋ Aussage hinzufügen</button>';
 }else if(s.type==='Ranking'){
   html+='<div class="field"><label>Ranking-Elemente <span class="subtle">(eine pro Zeile)</span></label><textarea id="optionsField" rows="6">'+esc((s.options||[]).join('\n'))+'</textarea></div>';
 }else{
   html+='<div class="subtle">Für diesen Fragetyp werden keine weiteren Antwortoptionen benötigt.</div>';
 }
 if(s.type==='Pin setzen'){
   html+='<div class="mediaBox"><div class="mediaHead"><strong>Karte / Hintergrundbild</strong><div class="mediaActions"><label class="uploadBtn">＋ Bild laden<input id="pinImageInput" type="file" accept="image/*"></label><button class="btn danger '+(s.pinImage?'':'hidden')+'" id="removePinImage" type="button">Entfernen</button></div></div><div class="mediaHint">Das Bild wird als Fläche verwendet, auf der die Schüler ihre Pins setzen.</div><div id="pinImageArea"></div></div>';
 }else{
   html+='<div class="mediaBox"><div class="mediaHead"><strong>Medien</strong><div class="mediaActions"><label class="uploadBtn">＋ Datei hochladen<input id="mediaInput" type="file" accept="image/*,video/*,audio/*"></label><button class="btn danger '+(s.media?'':'hidden')+'" id="removeMedia" type="button">Entfernen</button></div></div><div class="mediaHint">Bilder, Videos und Audiodateien bis 25 MB.</div><div id="mediaArea"></div></div>';
 }
 settings.innerHTML=html;wrap.appendChild(settings);root.appendChild(wrap);

 if($('optionsField'))$('optionsField').oninput=e=>{s.options=e.target.value.split('\n').map(v=>v.trim()).filter(Boolean);renderPreview();setSaveState('Ungespeicherte Änderungen')};
 if(s.type==='Skala')renderScaleItemEditor();
 if(s.type==='Pin setzen'){
   if($('pinImageInput'))$('pinImageInput').onchange=async e=>{const file=e.target.files?.[0];if(file)await uploadPinImage(file)};
   if($('removePinImage'))$('removePinImage').onclick=async()=>await removePinImage();
   renderPinImageArea();
 }else{
   $('mediaInput').onchange=async e=>{const file=e.target.files?.[0];if(file)await uploadMedia(file)};
   if($('removeMedia'))$('removeMedia').onclick=async()=>await removeMedia();
   renderMediaArea();
 }
}

function renderScaleItemEditor(){
 const s=slides[activeSlide],root=$('scaleItemsEditor');if(!root)return;root.innerHTML='';
 (s.scaleItems||[]).forEach((item,index)=>{
   const row=document.createElement('div');row.className='settings';row.style.marginBottom='9px';
   row.innerHTML='<div class="two"><div class="field"><label>Aussage '+(index+1)+'</label><textarea rows="2" class="scaleStatementInput" placeholder="z. B. Ich fühle mich im Unterricht sicher.">'+esc(item.statement||'')+'</textarea></div><div><div class="two"><div class="field"><label>Minimum</label><input class="scaleMin" type="number" value="'+Number(item.min)+'"></div><div class="field"><label>Maximum</label><input class="scaleMax" type="number" value="'+Number(item.max)+'"></div></div><button type="button" class="btn danger removeScaleItem" '+((s.scaleItems||[]).length===1?'disabled':'')+'>Aussage entfernen</button></div></div>';
   row.querySelector('.scaleStatementInput').oninput=e=>{item.statement=e.target.value;renderPreview();setSaveState('Ungespeicherte Änderungen')};
   const syncRange=()=>{let min=Number(row.querySelector('.scaleMin').value);let max=Number(row.querySelector('.scaleMax').value);if(!Number.isFinite(min))min=0;if(!Number.isFinite(max))max=10;if(max<=min)max=min+1;item.min=min;item.max=max;row.querySelector('.scaleMax').value=max;renderPreview();setSaveState('Ungespeicherte Änderungen')};
   row.querySelector('.scaleMin').oninput=syncRange;row.querySelector('.scaleMax').oninput=syncRange;
   row.querySelector('.removeScaleItem').onclick=()=>{s.scaleItems.splice(index,1);renderEditor();renderPreview();setSaveState('Ungespeicherte Änderungen')};
   root.appendChild(row);
 });
 const add=$('addScaleItem');if(add)add.onclick=()=>{s.scaleItems.push({statement:'Neue Aussage',min:0,max:10});renderEditor();renderPreview();setSaveState('Ungespeicherte Änderungen')};
}function updateCardQuestion(){
 const cards=[...document.querySelectorAll('.slideCard')],card=cards[activeSlide];if(card){const q=card.querySelector('.slideQuestion');q.textContent=slides[activeSlide].question||'Ohne Frage'}
}

function renderPinImageArea(){
 const s=slides[activeSlide],root=$('pinImageArea');if(!root)return;root.innerHTML='';
 if(!s.pinImage)return;
 const name=document.createElement('div');name.className='mediaName';name.textContent=s.pinImage.name||'Kartenbild';root.appendChild(name);
 const preview=document.createElement('div');preview.className='mediaPreview';
 const img=document.createElement('img');img.src=s.pinImage.url;img.alt=s.pinImage.name||'';preview.appendChild(img);
 root.appendChild(preview);
}
function renderMediaArea(){
 const s=slides[activeSlide],root=$('mediaArea');if(!root)return;root.innerHTML='';
 if(!s.media)return;
 const name=document.createElement('div');name.className='mediaName';name.textContent=s.media.name||'Medien-Datei';root.appendChild(name);
 const preview=document.createElement('div');preview.className='mediaPreview';
 if((s.media.mime||'').startsWith('image/')){const img=document.createElement('img');img.src=s.media.url;img.alt=s.media.name||'';preview.appendChild(img)}
 else if((s.media.mime||'').startsWith('video/')){const v=document.createElement('video');v.src=s.media.url;v.controls=true;preview.appendChild(v)}
 else {const a=document.createElement('audio');a.src=s.media.url;a.controls=true;preview.appendChild(a)}
 root.appendChild(preview);
}

function renderPreview(){
 const s=slides[activeSlide];if(!s)return;
 const root=$('previewStage');root.innerHTML='';
 const meta=typeMeta(s.type);
 const type=document.createElement('div');type.className='previewType';type.textContent=meta.title;root.appendChild(type);
 const q=document.createElement('div');q.className='previewQuestion';q.textContent=s.question||'Deine Frage';root.appendChild(q);
 if(s.media){
   const media=document.createElement('div');media.style.marginBottom='14px';
   if((s.media.mime||'').startsWith('image/')){const img=document.createElement('img');img.src=s.media.url;img.style.maxWidth='100%';img.style.maxHeight='190px';img.style.display='block';img.style.margin='0 auto';img.style.borderRadius='9px';media.appendChild(img)}
   else if((s.media.mime||'').startsWith('video/')){const v=document.createElement('video');v.src=s.media.url;v.controls=true;v.style.maxWidth='100%';v.style.maxHeight='190px';v.style.display='block';v.style.margin='0 auto';media.appendChild(v)}
   else {const a=document.createElement('audio');a.src=s.media.url;a.controls=true;a.style.width='100%';media.appendChild(a)}
   root.appendChild(media);
 }
 const area=document.createElement('div');
 if(s.type==='Multiple-Choice'){
   area.className='previewOptions';(s.options||[]).forEach(o=>{const d=document.createElement('div');d.className='previewOption';d.textContent=o;area.appendChild(d)});
 }else if(s.type==='Skala'){
   area.className='previewScale';
   (s.scaleItems||[]).forEach(item=>{const d=document.createElement('div');d.className='scalePreviewItem';const val=Number(item.min)<=0&&Number(item.max)>=0?0:Number(item.min);const range=Number(item.max)-Number(item.min)||1;const pct=Math.max(0,Math.min(100,(val-Number(item.min))/range*100));d.innerHTML='<div class="scaleStatement">'+esc(item.statement||'Aussage')+'</div><div class="scalePreviewTrack"><span>'+esc(item.min)+'</span><div class="scalePreviewRange"><div class="scalePreviewThumb" style="left:'+pct+'%"></div></div><span>'+esc(item.max)+'</span></div>';area.appendChild(d)})
 }else if(s.type==='Ranking'){
   area.className='previewRank';(s.options||[]).forEach((o,i)=>{const d=document.createElement('div');d.innerHTML='<b>'+(i+1)+'</b><span>'+esc(o)+'</span>';area.appendChild(d)});
 }else if(s.type==='Pin setzen'){
   area.className='previewPin';
   if(s.pinImage?.url){const img=document.createElement('img');img.src=s.pinImage.url;img.alt=s.pinImage.name||'';area.appendChild(img)}
   const label=document.createElement('div');label.className='previewPinLabel';label.textContent=s.pinImage?'Punkte werden auf diesem Bild gesetzt':'Noch kein Kartenbild geladen';area.appendChild(label);
 }else{
   area.className='previewText';area.textContent=s.type==='Wortwolke'?'Ein Wort oder kurzer Begriff …':'Antwort eingeben …';
 }
 root.appendChild(area);
}

function collectSlides(){return slides.map(s=>{const x={type:s.type,question:(s.question||'').trim(),options:Array.isArray(s.options)?s.options.filter(Boolean):[]};if(s.type==='Skala')x.scaleItems=(s.scaleItems||[]).map(item=>({statement:(item.statement||'').trim(),min:Number(item.min),max:Number(item.max)})).filter(item=>item.statement&&Number.isFinite(item.min)&&Number.isFinite(item.max)&&item.max>item.min);if(s.type==='Pin setzen'&&s.pinImage)x.pinImage=s.pinImage;if(s.type!=='Pin setzen'&&s.media)x.media=s.media;return x})}

async function persistSurvey(showMessage=true){
 const user=await requireUser();if(!user)return null;
 const name=$('surveyName').value.trim()||'Unbenannte Umfrage';
 const dataSlides=collectSlides();
 if(!dataSlides.length){toast('Bitte mindestens eine Folie anlegen.');return null}
 if(!currentSurvey){
   const {data,error}=await db.from('surveys').insert({owner_id:user.id,name,slides:dataSlides}).select().single();
   if(error){toast('Erstellen fehlgeschlagen: '+error.message);return null}
   currentSurvey=data;
   history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(data.id));
   $('modeText').textContent='bearbeiten';$('startBtn').disabled=false;
 }else{
   const {data,error}=await db.from('surveys').update({name,slides:dataSlides,updated_at:new Date().toISOString()}).eq('id',currentSurvey.id).select().single();
   if(error){toast('Speichern fehlgeschlagen: '+error.message);return null}
   currentSurvey=data;
 }
 if(showMessage)toast('Umfrage gespeichert.');
 setSaveState('Gespeichert');
 return currentSurvey;
}

async function save(){await persistSurvey(true)}
async function ensureSurveySaved(){if(currentSurvey)return currentSurvey;return await persistSurvey(false)}

async function uploadPinImage(file){
 if(file.size>25*1024*1024){toast('Die Datei ist größer als 25 MB.');return}
 const survey=await ensureSurveySaved();if(!survey)return;
 const user=(await db.auth.getUser()).data.user;if(!user){toast('Bitte erneut anmelden.');return}
 const oldImage=slides[activeSlide].pinImage;
 const safeName=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-');
 const path=user.id+'/'+survey.id+'/pin-'+crypto.randomUUID()+'-'+safeName;
 setSaveState('Kartenbild wird hochgeladen …');
 const {data,error}=await db.storage.from('survey-media').upload(path,file,{contentType:file.type,cacheControl:'3600',upsert:false});
 if(error){toast('Upload fehlgeschlagen: '+error.message);setSaveState('Speichern erforderlich');return}
 const {data:urlData}=db.storage.from('survey-media').getPublicUrl(data.path);
 slides[activeSlide].pinImage={path:data.path,url:urlData.publicUrl,name:file.name,mime:file.type};
 if(oldImage?.path)await removeStorageObject(oldImage.path).catch(()=>{});
 renderEditor();renderPreview();await persistSurvey(false);toast('Kartenbild hinzugefügt.');setSaveState('Gespeichert');
}
async function removePinImage(){
 const image=slides[activeSlide].pinImage;if(!image)return;
 try{if(image.path)await removeStorageObject(image.path)}catch(e){toast('Bild konnte nicht entfernt werden: '+(e.message||''));return}
 slides[activeSlide].pinImage=null;
 renderEditor();renderPreview();await persistSurvey(false);toast('Kartenbild entfernt.');setSaveState('Gespeichert');
}
async function uploadMedia(file){
 if(file.size>25*1024*1024){toast('Die Datei ist größer als 25 MB.');return}
 const survey=await ensureSurveySaved();if(!survey)return;
 const user=(await db.auth.getUser()).data.user;if(!user){toast('Bitte erneut anmelden.');return}
 const oldMedia=slides[activeSlide].media;
 const safeName=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-');
 const path=user.id+'/'+survey.id+'/'+crypto.randomUUID()+'-'+safeName;
 setSaveState('Medien werden hochgeladen …');
 const {data,error}=await db.storage.from('survey-media').upload(path,file,{contentType:file.type,cacheControl:'3600',upsert:false});
 if(error){toast('Upload fehlgeschlagen: '+error.message);setSaveState('Speichern erforderlich');return}
 const {data:urlData}=db.storage.from('survey-media').getPublicUrl(data.path);
 slides[activeSlide].media={path:data.path,url:urlData.publicUrl,name:file.name,mime:file.type};
 if(oldMedia?.path)await removeStorageObject(oldMedia.path);
 renderEditor();renderPreview();await persistSurvey(false);toast('Medien hinzugefügt.');setSaveState('Gespeichert');
}

async function removeStorageObject(path){
 if(!path)return;
 const {error}=await db.storage.from('survey-media').remove([path]);
 if(error)throw error;
}

async function removeMedia(){
 const media=slides[activeSlide].media;if(!media)return;
 try{if(media.path)await removeStorageObject(media.path)}catch(e){toast('Datei konnte nicht entfernt werden: '+(e.message||''));return}
 slides[activeSlide].media=null;
 renderEditor();renderPreview();await persistSurvey(false);toast('Medien entfernt.');setSaveState('Gespeichert');
}

async function start(){
 const survey=await persistSurvey(false);if(!survey)return;
 const user=await requireUser();if(!user)return;
 const join_code=Math.random().toString(36).slice(2,7).toUpperCase();
 const {data,error}=await db.from('sessions').insert({survey_id:survey.id,owner_id:user.id,title:survey.name,survey_snapshot:survey.slides,status:'lobby',current_slide:0,join_code}).select().single();
 if(error){toast('Session konnte nicht gestartet werden: '+error.message);return}
 location.href='umfrage-live.html?id='+encodeURIComponent(data.id);
}

$('backBtn').onclick=()=>location.href='dashboard.html';
$('addSlideBtn').onclick=()=>{slides.push(newSlide());activeSlide=slides.length-1;renderSlides();renderEditor();renderPreview();setSaveState('Ungespeicherte Änderungen')};
$('saveBtn').onclick=save;
$('startBtn').onclick=start;
$('surveyName').oninput=()=>setSaveState('Ungespeicherte Änderungen');
load();
</script>
</body>
</html>
