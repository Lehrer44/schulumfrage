<style>
:root{--bg:#f1efe6;--line:#93856a;--line-soft:#afa48f;--text:#5c5547;--muted:#90836b;--accent:#918469;--accent-dark:#6e624e;--danger:#ef726b;--ok:#22a867}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.wrap{max-width:1320px;margin:0 auto;padding:24px 18px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}.title{font-size:27px;font-weight:500;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:2px solid var(--line);border-radius:8px;background:rgba(246,244,236,.56);color:var(--muted);font:inherit;font-weight:600;padding:9px 14px;cursor:pointer}.btn:hover{background:#e9e5d8;color:var(--accent-dark)}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}#startBtn{background:#218c55;border-color:#218c55;color:#fff;font-weight:750;box-shadow:0 2px 0 #17683e;transition:background .16s,transform .16s,box-shadow .16s}#startBtn:hover{background:#187445;border-color:#187445;transform:translateY(-1px);box-shadow:0 4px 0 #125c37}#startBtn:active{transform:translateY(1px);box-shadow:0 1px 0 #125c37}#startBtn:focus-visible{outline:3px solid #a9dfbd;outline-offset:3px}.btn:disabled{opacity:.45;cursor:not-allowed}.session{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.main,.participants{border:2px solid var(--line);border-radius:18px;background:rgba(246,244,236,.18)}.main{padding:16px}.questionHead{display:grid;grid-template-columns:120px 1fr 120px;gap:12px;align-items:center}.question{font-size:31px;line-height:1.22;text-align:center;color:var(--muted);padding:0 8px}.questionMedia{margin:0 auto 12px;text-align:center}.questionMedia img,.questionMedia video{max-width:100%;max-height:280px;border-radius:10px}.questionMedia audio{width:min(100%,600px)}.options{display:grid;gap:8px;width:min(78%,650px);margin:12px auto}.option{border:2px solid var(--line);border-radius:9px;padding:8px 10px;background:rgba(246,244,236,.35);color:var(--muted);font-size:17px}.answers{border:2px solid var(--line);border-radius:12px;padding:13px;margin-top:15px;min-height:420px;background:rgba(244,241,231,.3)}.answers h2{font-size:24px;font-weight:500;color:var(--muted);margin:0 0 3px}.subtle{font-size:13px;color:var(--muted)}.metricRow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.metric{border:2px solid var(--line);border-radius:11px;padding:9px 12px;min-width:120px;background:rgba(242,239,228,.78)}.metric strong{display:block;font-size:23px;color:var(--accent-dark)}.metric span{font-size:13px;color:var(--muted)}.barRow{display:grid;grid-template-columns:minmax(100px,180px) 1fr 60px;gap:10px;align-items:center;margin:9px 0}.barTrack{height:15px;border-radius:99px;background:#ded8ca;overflow:hidden}.barFill{height:100%;background:var(--accent)}.scaleLive{display:grid;gap:12px}.scaleLiveItem{border:2px solid var(--line-soft);border-radius:11px;padding:11px;background:rgba(247,244,234,.45)}.scaleLiveStatement{font-weight:650;color:var(--text);margin-bottom:9px}.scaleLiveTrack{height:12px;border-radius:99px;background:#ded8ca;overflow:visible;position:relative}.scaleLiveMarker{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 5px rgba(70,60,40,.25)}.scaleLiveMeta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}.chipCloud{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center;justify-content:center;padding:24px 16px;min-height:250px;border:1px solid #d8cfba;border-radius:16px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.82),rgba(239,234,222,.7) 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);overflow:hidden}.chip{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;overflow-wrap:anywhere;padding:6px 11px;border-radius:12px;font-size:var(--word-size,22px);font-weight:750;line-height:1.1;letter-spacing:-.025em;border:1px solid #c9bea6;box-shadow:0 2px 0 rgba(83,71,49,.06);transition:transform .16s,box-shadow .16s,background .16s}.chip:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(83,71,49,.12)}.chip.high{background:#d9d0b9;border-color:#9b8c6a;color:#4e473a}.chip.mid{background:#e7dfcc;border-color:#b8ac91;color:#5c5547}.chip.low{background:rgba(250,248,241,.9);border-color:#d8cfbc;color:#6c624f}.chip small{flex:none;font-size:.48em;letter-spacing:0;font-weight:750;opacity:.7;background:rgba(255,255,255,.58);padding:3px 5px;border-radius:999px}.textAnswer{padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:rgba(247,244,234,.6);margin-top:9px}.textAnswer .name{font-weight:700}.time{font-size:12px;color:var(--muted)}.pinBoard{position:relative;width:100%;height:auto;aspect-ratio:16/9;border:2px solid var(--line);border-radius:14px;background:#ece8dd;overflow:hidden}.pinMapImage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}.pinLegend{display:grid;gap:6px;margin-top:10px}.pinLegendItem{display:flex;align-items:center;gap:8px;border:2px solid var(--line-soft);border-radius:8px;padding:6px 8px;background:rgba(247,244,234,.55)}.pinLegendDot{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(70,60,40,.25);flex:none}.pinBoard:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#92856a24 1px,transparent 1px),linear-gradient(90deg,#92856a24 1px,transparent 1px);background-size:10% 20%}.pin{position:absolute;width:2.8%;height:auto;aspect-ratio:1;border-radius:50%;background:var(--danger);border:clamp(1px,.35vw,3px) solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(70,60,40,.25)}.rankRow{display:grid;grid-template-columns:40px 1fr 60px;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid #ded8ca}.rankRow:last-child{border-bottom:0}.empty{padding:25px;text-align:center;color:var(--muted)}.participants{padding:16px;align-self:start;position:sticky;top:16px}.partHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.partHead h2{margin:0;font-size:24px;font-weight:500;color:var(--muted)}.partCount{font-size:13px;color:var(--muted)}.participantList{display:grid;gap:7px;max-height:calc(100vh - 170px);overflow:auto}.participant{display:grid;grid-template-columns:11px minmax(0,1fr) auto;gap:8px;align-items:center;border:2px solid var(--line);border-radius:9px;padding:8px 9px;background:rgba(247,244,234,.45);cursor:pointer;text-align:left}.participant:hover{background:#ebe7d9}.participant:focus{outline:2px solid var(--accent);outline-offset:1px}.participant.disabled{cursor:default;opacity:.8}.participant.disabled:hover{background:rgba(247,244,234,.45)}.participantDot{width:9px;height:9px;border-radius:50%;background:#b9b2a2}.participant.answered{background:#e6eee5}.participant.answered .participantDot{background:var(--ok)}.participantAction{font-size:11px;color:var(--muted);white-space:nowrap}.participant.answered .participantAction{color:var(--ok);font-weight:650}.accessModal{position:fixed;inset:0;background:rgba(74,66,53,.24);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(520px,100%);background:var(--bg);border:2px solid var(--line);border-radius:24px;padding:22px;position:relative}.close{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--muted);font-size:22px;cursor:pointer}.code{font-size:54px;letter-spacing:8px;font-weight:750;text-align:center;color:var(--accent-dark);margin:12px 0 8px}.qr{display:flex;align-items:center;justify-content:center;background:#fff;padding:18px;border-radius:12px;margin:14px auto;width:min(320px,100%)}.qr canvas,.qr img{display:block;max-width:100%;height:auto}.modalNote{text-align:center;color:var(--muted);line-height:1.45}.hidden{display:none!important}
@media(max-width:1000px){.session{grid-template-columns:1fr}.participants{position:static}.participantList{max-height:320px}.questionHead{grid-template-columns:1fr}.question{order:-1;font-size:27px}.options{width:100%}}
@media(max-width:650px){.chipCloud{gap:7px;padding:16px 8px;min-height:190px}.chip{font-size:min(var(--word-size,22px),34px);padding:5px 8px;border-radius:10px}.wrap{padding:16px 12px 26px}.top{align-items:flex-start;flex-direction:column}.title{font-size:23px}.actions{width:100%}.actions .btn{flex:1}.metric{min-width:0;flex:1}.answers{min-height:320px}.barRow{grid-template-columns:1fr}.barTrack{grid-column:1}.question{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div><div class="title" id="sessionTitle">Umfrage</div><div class="subtle" id="connection">Realtime verbindet …</div></div>
<div class="actions"><button class="btn accent" id="accessBtn">Teilnahme</button><button class="btn accent" id="startBtn">▶ Umfrage starten</button><button class="btn" id="restartBtn">Neu starten</button><button class="btn danger" id="stopBtn">Beenden</button></div>
</header>
<div class="metricRow">
<div class="metric"><strong id="participantMetric">0</strong><span>Teilnehmer</span></div>
<div class="metric"><strong id="rateMetric">0%</strong><span>Antwortquote</span></div>
<div class="metric"><strong id="slideMetric">0 / 0</strong><span>Folie</span></div>
</div>
<main class="session">
<section class="main">
<div class="questionHead">
<button class="btn" id="prevBtn">← zurück</button>
<div class="question" id="liveQuestion">Warte …</div>
<button class="btn" id="nextBtn">weiter →</button>
</div>
<div id="questionMedia" class="questionMedia"></div><div class="options" id="liveOptions"></div>
<div class="answers"><h2 id="answerTitle">Live-Antworten</h2><div class="subtle">Die Ansicht aktualisiert sich automatisch, sobald Schüler antworten.</div><div id="answers"></div></div>
</section>
<aside class="participants">
<div class="partHead"><div><h2>Teilnehmer</h2><div class="partCount" id="participantSummary">0 von 0 beantwortet</div></div></div>
<div class="participantList" id="participantList"></div>
</aside>
</main>
</div>
<div class="accessModal hidden" id="accessModal">
<div class="modal">
<button class="close" id="closeAccess" aria-label="Schließen">×</button>
<div class="modalNote">Teilnahmecode</div>
<div class="code" id="joinCode">------</div>
<div class="qr" id="qrBox"></div>
<div class="modalNote">Schüler scannen den QR-Code und gelangen direkt zur Schülerseite.</div>
</div>
</div>
<script>
const SUPABASE_URL='https://mqtcwiiawmuxrpkjfrfc.supabase.co';
const SUPABASE_KEY='sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let currentSession=null,realtimeChannel=null,controlChannel=null,participantMap=new Map(),currentRows=[],syncTimer=null,syncing=false,liveDataRequestToken=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function requireUser(){const {data,error}=await db.auth.getUser();if(error||!data.user){location.href='teacher.html';return null}return data.user}
function setConnection(text){$('connection').textContent=text}
async function load(){const user=await requireUser();if(!user)return;const id=new URLSearchParams(location.search).get('id');if(!id){location.href='dashboard.html';return}const {data,error}=await db.from('sessions').select('*').eq('id',id).single();if(error||!data||data.owner_id!==user.id){location.href='dashboard.html';return}currentSession=data;if(data.status==='ended'){location.href='dashboard.html';return}$('sessionTitle').textContent=data.title||'Umfrage';$('joinCode').textContent=data.join_code||'------';renderSession();await refreshLiveData();subscribe();if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(syncSessionStatus,3000);syncSessionStatus()}
async function syncSessionStatus(){if(!currentSession||syncing)return;syncing=true;try{const {data,error}=await db.from('sessions').select('*').eq('id',currentSession.id).maybeSingle();if(error)throw error;if(!data)throw new Error('Session nicht gefunden');const changed=data.updated_at!==currentSession.updated_at||data.current_slide!==currentSession.current_slide||data.status!==currentSession.status;currentSession=data;if(data.status==='ended'){await cleanup();if(syncTimer)clearInterval(syncTimer);location.href='dashboard.html';return}if(changed){renderSession();await refreshLiveData()}setConnection('Verbindung stabil · automatische Prüfung aktiv')}catch(e){setConnection('Verbindung unterbrochen – erneuter Versuch: '+(e.message||'Fehler'))}finally{syncing=false}}
function subscribe(){if(realtimeChannel)db.removeChannel(realtimeChannel);if(controlChannel)db.removeChannel(controlChannel);realtimeChannel=db.channel('teacher-live-'+currentSession.id).on('postgres_changes',{event:'*',schema:'public',table:'sessions'},payload=>{if(payload.new&&payload.new.id===currentSession.id){currentSession=payload.new;if(currentSession.status==='ended'){cleanup();location.href='dashboard.html';return}renderSession();refreshLiveData()}}).on('postgres_changes',{event:'*',schema:'public',table:'participants'},payload=>{if(payload.new?.session_id===currentSession.id||payload.old?.session_id===currentSession.id)refreshLiveData()}).on('postgres_changes',{event:'*',schema:'public',table:'responses'},payload=>{if(payload.new?.session_id===currentSession.id||payload.old?.session_id===currentSession.id)refreshLiveData()}).subscribe((status,err)=>{if(status==='SUBSCRIBED'){setConnection('Realtime verbunden');refreshLiveData();syncSessionStatus()}else setConnection('Realtime: '+status+(err?.message?' · '+err.message:''))});controlChannel=db.channel('student-session-'+currentSession.id);controlChannel.subscribe()}
async function cleanup(){if(syncTimer){clearInterval(syncTimer);syncTimer=null}if(realtimeChannel){await db.removeChannel(realtimeChannel);realtimeChannel=null}if(controlChannel){await db.removeChannel(controlChannel);controlChannel=null}}
function responseValue(r){return r?.answer?.value}
function isTeacherMarked(r){return r?.answer?.teacherMarked===true}
async function sendStudentControl(participantId,action){if(!controlChannel)return;await controlChannel.send({type:'broadcast',event:'teacher_control',payload:{session_id:currentSession.id,participant_id:participantId,slide_index:Number(currentSession.current_slide)||0,action}})}
async function refreshLiveData(){if(!currentSession)return;const sid=currentSession.id,requestToken=++liveDataRequestToken;const [p,r]=await Promise.all([db.from('participants').select('id,name').eq('session_id',sid).order('joined_at',{ascending:true}),db.from('responses').select('id,participant_id,slide_index,answer,created_at').eq('session_id',sid).order('created_at',{ascending:false})]);if(requestToken!==liveDataRequestToken||!currentSession||currentSession.id!==sid)return;if(p.error||r.error){setConnection('Daten konnten nicht geladen werden');return}const participants=p.data||[],responses=r.data||[],idx=Number(currentSession.current_slide)||0;currentRows=currentSession.status==='running'?responses.filter(x=>x.slide_index===idx):[];const answered=new Set(currentRows.map(x=>x.participant_id));participantMap=new Map(participants.map(x=>[x.id,x.name||'Schüler']));participantColorMap=new Map(participants.map((p,i)=>[p.id,'hsl('+Math.round(i/Math.max(1,participants.length)*360)+',68%,48%)']));$('participantMetric').textContent=participants.length;$('rateMetric').textContent=(participants.length?Math.round(answered.size/participants.length*100):0)+'%';$('participantSummary').textContent=answered.size+' von '+participants.length+' beantwortet';renderParticipants(participants,currentRows);renderAnswers(currentRows,(currentSession.survey_snapshot||[])[idx]||{})}
function renderParticipants(participants,rows){const root=$('participantList');if(!participants.length){root.innerHTML='<div class="empty">Noch keine Teilnehmer.</div>';return}const byParticipant=new Map(rows.map(r=>[r.participant_id,r]));const running=currentSession?.status==='running';root.innerHTML=participants.map(p=>{const r=byParticipant.get(p.id),marked=isTeacherMarked(r),answered=!!r,action=!running?'':(marked?'Markierung aufheben':answered?'Antwort zurücksetzen':'Als beantwortet markieren');return '<div class="participant '+(answered?'answered ':'')+(!running?'disabled':'')+'" data-participant-id="'+p.id+'" role="button" tabindex="'+(running?'0':'-1')+'" title="'+esc(action||'')+'"><span class="participantDot"></span><span>'+esc(p.name||'Schüler')+'</span><span class="participantAction">'+(running?action:'')+'</span></div>'}).join('')}
function renderSession(){const slides=currentSession.survey_snapshot||[],i=Number(currentSession.current_slide)||0,f=slides[i]||{},running=currentSession.status==='running';renderQuestionMedia(running&&f.type!=='Pin setzen'?f.media:null);$('slideMetric').textContent=(running&&slides.length?i+1:0)+' / '+slides.length;$('prevBtn').disabled=!running||i<=0;$('nextBtn').disabled=!running||i>=slides.length-1;$('startBtn').classList.toggle('hidden',running);$('restartBtn').disabled=!running;$('liveQuestion').textContent=running?(f.question||'Keine Frage'):'Bereit zum Start';$('liveOptions').innerHTML=running&&f.type==='Skala'?'<div class="scaleLive">'+(f.scaleItems||[]).map(item=>'<div class="scaleLiveItem"><div class="scaleLiveStatement">'+esc(item.statement||'Aussage')+'</div><div class="scaleLiveMeta"><span>'+esc(item.min)+'</span><span>Schieberegler</span><span>'+esc(item.max)+'</span></div></div>').join('')+'</div>':running&&['Multiple-Choice','Ranking'].includes(f.type||'')?(f.options||[]).map(o=>'<div class="option">'+esc(o)+'</div>').join(''):'<div class="empty">'+(running?'':'Die Schüler können jetzt beitreten. Die erste Frage wird erst nach dem Start angezeigt.')+'</div>';$('answerTitle').textContent=running?'Live-Antworten':'Noch keine Live-Antworten';if(running&&f.type==='Pin setzen')renderAnswers([],f);}
function renderQuestionMedia(media){const root=$('questionMedia');if(!root)return;root.innerHTML='';if(!media||!media.url)return;const mime=media.mime||'';if(mime.startsWith('image/')){const img=document.createElement('img');img.src=media.url;img.alt=media.name||'';root.appendChild(img)}else if(mime.startsWith('video/')){const v=document.createElement('video');v.src=media.url;v.controls=true;v.playsInline=true;root.appendChild(v)}else if(mime.startsWith('audio/')){const a=document.createElement('audio');a.src=media.url;a.controls=true;root.appendChild(a)}}
function renderAnswers(rows,f){const root=$('answers');root.innerHTML='';const t=f.type||'Offene Frage';const displayRows=rows.filter(r=>!isTeacherMarked(r));if(t==='Pin setzen')return renderPins(root,displayRows,f);if(!displayRows.length){root.innerHTML='<div class="empty">Noch keine Antworten auf dieser Folie.</div>';return}if(t==='Multiple-Choice')return renderChoices(root,displayRows,f.options||[]);if(t==='Skala')return renderScale(root,displayRows,f.scaleItems||[]);if(t==='Wortwolke')return renderWords(root,displayRows);if(t==='Ranking')return renderRanking(root,displayRows,f.options||[]);renderTexts(root,displayRows)}
function renderChoices(root,rows,options){const counts=new Map(options.map(o=>[o,0]));rows.forEach(r=>{const v=String(responseValue(r));counts.set(v,(counts.get(v)||0)+1)});const max=Math.max(1,rows.length);root.innerHTML=options.map(o=>{const c=counts.get(o)||0;return '<div class="barRow"><div>'+esc(o)+'</div><div class="barTrack"><div class="barFill" style="width:'+Math.round(c/max*100)+'%"></div></div><div><b>'+c+'</b></div></div>'}).join('')}
function renderScale(root,rows,items){if(!items.length){root.innerHTML='<div class="empty">Keine Skalen-Aussagen definiert.</div>';return}root.innerHTML='<div class="scaleLive">'+items.map((item,index)=>{const min=Number(item.min),max=Number(item.max),range=max-min||1;const values=rows.map(r=>Number(r?.answer?.value?.values?.[index]?.value)).filter(v=>Number.isFinite(v));const avg=values.length?values.reduce((a,b)=>a+b,0)/values.length:null;const pct=avg===null?50:Math.max(0,Math.min(100,(avg-min)/range*100));return '<div class="scaleLiveItem"><div class="scaleLiveStatement">'+esc(item.statement||'Aussage')+'</div><div class="scaleLiveTrack"><div class="scaleLiveMarker" style="left:'+pct+'%"></div></div><div class="scaleLiveMeta"><span>'+min+'</span><strong>'+(avg===null?'–':avg.toFixed(1))+'</strong><span>'+max+'</span></div></div>'}).join('')+'</div>'}
function renderWords(root,rows){const words=new Map();rows.forEach(r=>{const v=String(responseValue(r)||'').trim().toLocaleLowerCase('de-DE');v.split(/[^\p{L}\p{N}äöüÄÖÜß'-]+/u).filter(w=>w.length>2).forEach(w=>words.set(w,(words.get(w)||0)+1))});const stop=new Set('und oder der die das ein eine einer eines einem einen ich wir ihr sie er es ist sind war für von mit auf im in zu den dem des dass auch als sich nicht sehr aber wie'.split(' '));const arr=[...words.entries()].filter(([w])=>!stop.has(w)).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'de')).slice(0,40);if(!arr.length){root.innerHTML='<div class="empty">Noch keine auswertbaren Wörter.</div>';return}const max=arr[0][1],allEqual=arr.every(([,count])=>count===max);root.innerHTML='<div class="chipCloud" aria-label="Wortwolke">'+arr.map(([w,c])=>{const ratio=c/max;const size=allEqual?23:Math.round(16+30*Math.pow(ratio,.6));const level=ratio>=.7?'high':ratio>=.35?'mid':'low';return '<span class="chip '+level+'" style="--word-size:'+size+'px" title="'+esc(c+' '+(c===1?'Nennung':'Nennungen'))+'">'+esc(w)+' <small>'+c+'</small></span>'}).join('')+'</div>'}
function renderTexts(root,rows){root.innerHTML=rows.map(r=>'<div class="textAnswer"><div><span class="name">'+esc(participantMap.get(r.participant_id)||'Schüler')+'</span> <span class="time">'+new Date(r.created_at).toLocaleTimeString('de-DE')+'</span></div><div style="margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(String(responseValue(r)??''))+'</div></div>').join('')}
let participantColorMap=new Map();
function participantColor(id){return participantColorMap.get(id)||'#918469'}
function renderPins(root,rows,f){const valid=rows.filter(r=>{const v=responseValue(r);return v&&typeof v.x==='number'&&typeof v.y==='number'});const image=f?.pinImage?.url?'<img class="pinMapImage" src="'+esc(f.pinImage.url)+'" alt="">':'';const pins=valid.map(r=>{const v=responseValue(r),name=participantMap.get(r.participant_id)||'Schüler',color=participantColor(r.participant_id);return '<div class="pin" title="'+esc(name)+'" style="left:'+Math.max(0,Math.min(100,v.x))+'%;top:'+Math.max(0,Math.min(100,v.y))+'%;background:'+color+'"></div>'}).join('');const legend=[...new Map(valid.map(r=>[r.participant_id,r])).values()].map(r=>{const name=participantMap.get(r.participant_id)||'Schüler',color=participantColor(r.participant_id);return '<div class="pinLegendItem"><span class="pinLegendDot" style="background:'+color+'"></span><span>'+esc(name)+'</span></div>'}).join('');root.innerHTML='<div class="pinBoard">'+image+pins+'</div><div class="pinLegend">'+(legend||'<div class="subtle">Noch keine gesetzten Pins.</div>')+'</div>';const img=root.querySelector('.pinMapImage');const board=root.querySelector('.pinBoard');if(img&&board){const sync=()=>{if(img.naturalWidth&&img.naturalHeight)board.style.aspectRatio=img.naturalWidth+' / '+img.naturalHeight};if(img.complete)sync();else img.addEventListener('load',sync,{once:true})}}
async function toggleParticipant(participantId){if(!currentSession||currentSession.status!=='running')return;const row=currentRows.find(r=>r.participant_id===participantId);if(row){const {error}=await db.from('responses').delete().eq('id',row.id);if(error){setConnection('Antwort konnte nicht zurückgesetzt werden: '+error.message);return}await sendStudentControl(participantId,'reset');setConnection('Antwort von '+(participantMap.get(participantId)||'Schüler')+' zurückgesetzt');}else{const {error}=await db.from('responses').insert({session_id:currentSession.id,participant_id:participantId,slide_index:Number(currentSession.current_slide)||0,answer:{value:null,teacherMarked:true}});if(error){setConnection('Teilnehmer konnte nicht als beantwortet markiert werden: '+error.message);return}await sendStudentControl(participantId,'mark_answered');setConnection((participantMap.get(participantId)||'Schüler')+' als beantwortet markiert');}await refreshLiveData()}
function renderRanking(root,rows,options){const pos=new Map(options.map(o=>[o,[]]));rows.forEach(r=>{const v=responseValue(r);if(Array.isArray(v))v.forEach((o,i)=>{if(pos.has(o))pos.get(o).push(i+1)})});const ranked=options.map(o=>{const vals=pos.get(o)||[];const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):Number.POSITIVE_INFINITY;return {option:o,avg,count:vals.length}}).sort((a,b)=>{if(a.avg!==b.avg)return a.avg-b.avg;if(a.count!==b.count)return b.count-a.count;return options.indexOf(a.option)-options.indexOf(b.option)});root.innerHTML=ranked.map((item,i)=>{const avg=Number.isFinite(item.avg)?item.avg.toFixed(1):'–';return '<div class="rankRow"><b>'+(i+1)+'</b><div>'+esc(item.option)+'<div class="subtle">Durchschnitt: '+avg+'</div></div><div class="subtle">'+item.count+'x</div></div>'}).join('')}
async function move(delta){const slides=currentSession.survey_snapshot||[],next=Math.max(0,Math.min(slides.length-1,(Number(currentSession.current_slide)||0)+delta));if(next===(Number(currentSession.current_slide)||0))return;const {data,error}=await db.from('sessions').update({current_slide:next,updated_at:new Date().toISOString()}).eq('id',currentSession.id).select().single();if(error){setConnection('Folie konnte nicht geändert werden');return}currentSession=data;renderSession();refreshLiveData()}
async function startSession(){if(currentSession.status==='running')return;const {data,error}=await db.from('sessions').update({status:'running',started_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',currentSession.id).select().single();if(error){setConnection('Umfrage konnte nicht gestartet werden: '+error.message);return}currentSession=data;renderSession();refreshLiveData()}
async function restart(){if(!confirm('Alle bisherigen Antworten dieser Session löschen und wieder bei Folie 1 starten? Die Teilnehmer bleiben erhalten.'))return;const {data,error}=await db.rpc('restart_owned_session',{p_session_id:currentSession.id});if(error){setConnection('Session konnte nicht neu gestartet werden: '+error.message);return}currentSession=Array.isArray(data)?data[0]:data;if(!currentSession){setConnection('Session konnte nicht neu gestartet werden: keine Sitzungsdaten erhalten');return}renderSession();await refreshLiveData()}
async function stop(){if(!confirm('Sitzung wirklich beenden und zur Übersicht zurückkehren?'))return;const {error}=await db.from('sessions').update({status:'ended',updated_at:new Date().toISOString()}).eq('id',currentSession.id);if(error){setConnection('Session konnte nicht beendet werden');return}await cleanup();location.href='dashboard.html'}
$('participantList').onclick=e=>{const row=e.target.closest('.participant[data-participant-id]');if(!row||row.classList.contains('disabled'))return;runSessionAction(()=>toggleParticipant(row.dataset.participantId))};$('participantList').onkeydown=e=>{if(e.key!=='Enter'&&e.key!==' ')return;const row=e.target.closest('.participant[data-participant-id]');if(!row||row.classList.contains('disabled'))return;e.preventDefault();runSessionAction(()=>toggleParticipant(row.dataset.participantId))};
function openAccess(){ $('joinCode').textContent=currentSession.join_code||'------';$('accessModal').classList.remove('hidden');const box=$('qrBox');box.innerHTML='';const url=new URL('student.html',location.href).href;if(typeof QRCode!=='undefined')new QRCode(box,{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.H})}
function closeAccess(){$('accessModal').classList.add('hidden');$('qrBox').innerHTML=''}
let sessionActionBusy=false;
async function runSessionAction(action){
  if(sessionActionBusy)return;
  sessionActionBusy=true;
  const buttons=['prevBtn','nextBtn','startBtn','restartBtn','stopBtn','participantList'].map(id=>$(id)).filter(Boolean);
  buttons.forEach(button=>button.setAttribute('aria-busy','true'));
  ['prevBtn','nextBtn','startBtn','restartBtn','stopBtn'].forEach(id=>$(id).disabled=true);
  try{await action()}
  finally{
    sessionActionBusy=false;
    buttons.forEach(button=>button.removeAttribute('aria-busy'));
    renderSession();
  }
}
$('prevBtn').onclick=()=>runSessionAction(()=>move(-1));$('nextBtn').onclick=()=>runSessionAction(()=>move(1));$('startBtn').onclick=()=>runSessionAction(startSession);$('restartBtn').onclick=()=>runSessionAction(restart);$('stopBtn').onclick=()=>runSessionAction(stop);$('accessBtn').onclick=openAccess;$('closeAccess').onclick=closeAccess;$('accessModal').onclick=e=>{if(e.target.id==='accessModal')closeAccess()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAccess()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&currentSession){syncSessionStatus();refreshLiveData()}});
load();
</script>
</body>
