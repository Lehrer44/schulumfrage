<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchulUmfrage – Live-Umfrage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f1efe6;--line:#93856a;--line-soft:#afa48f;--text:#5c5547;--muted:#90836b;--accent:#918469;--accent-dark:#6e624e;--danger:#ef726b;--ok:#22a867}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.wrap{max-width:1320px;margin:0 auto;padding:24px 18px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}.title{font-size:27px;font-weight:500;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:2px solid var(--line);border-radius:8px;background:rgba(246,244,236,.56);color:var(--muted);font:inherit;font-weight:600;padding:9px 14px;cursor:pointer}.btn:hover{background:#e9e5d8;color:var(--accent-dark)}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.session{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.main,.participants{border:2px solid var(--line);border-radius:18px;background:rgba(246,244,236,.18)}.main{padding:16px}.questionHead{display:grid;grid-template-columns:120px 1fr 120px;gap:12px;align-items:center}.question{font-size:31px;line-height:1.22;text-align:center;color:var(--muted);padding:0 8px}.options{display:grid;gap:8px;width:min(78%,650px);margin:12px auto}.option{border:2px solid var(--line);border-radius:9px;padding:8px 10px;background:rgba(246,244,236,.35);color:var(--muted);font-size:17px}.answers{border:2px solid var(--line);border-radius:12px;padding:13px;margin-top:15px;min-height:420px;background:rgba(244,241,231,.3)}.answers h2{font-size:24px;font-weight:500;color:var(--muted);margin:0 0 3px}.subtle{font-size:13px;color:var(--muted)}.metricRow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.metric{border:2px solid var(--line);border-radius:11px;padding:9px 12px;min-width:120px;background:rgba(242,239,228,.78)}.metric strong{display:block;font-size:23px;color:var(--accent-dark)}.metric span{font-size:13px;color:var(--muted)}.barRow{display:grid;grid-template-columns:minmax(100px,180px) 1fr 60px;gap:10px;align-items:center;margin:9px 0}.barTrack{height:15px;border-radius:99px;background:#ded8ca;overflow:hidden}.barFill{height:100%;background:var(--accent)}.chipCloud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:10px}.chip{padding:6px 11px;border-radius:999px;background:#e6e0d2;border:2px solid var(--line-soft)}.textAnswer{padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:rgba(247,244,234,.6);margin-top:9px}.textAnswer .name{font-weight:700}.time{font-size:12px;color:var(--muted)}.pinBoard{position:relative;height:320px;border:2px solid var(--line);border-radius:14px;background:#ece8dd;overflow:hidden}.pinBoard:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#92856a24 1px,transparent 1px),linear-gradient(90deg,#92856a24 1px,transparent 1px);background-size:10% 20%}.pin{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--danger);border:3px solid #fff;transform:translate(-50%,-50%)}.rankRow{display:grid;grid-template-columns:40px 1fr 60px;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid #ded8ca}.rankRow:last-child{border-bottom:0}.empty{padding:25px;text-align:center;color:var(--muted)}.participants{padding:16px;align-self:start;position:sticky;top:16px}.partHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.partHead h2{margin:0;font-size:24px;font-weight:500;color:var(--muted)}.partCount{font-size:13px;color:var(--muted)}.participantList{display:grid;gap:7px;max-height:calc(100vh - 170px);overflow:auto}.participant{display:grid;grid-template-columns:11px 1fr auto;gap:8px;align-items:center;border:2px solid var(--line);border-radius:9px;padding:8px 9px;background:rgba(247,244,234,.45)}.participantDot{width:9px;height:9px;border-radius:50%;background:#b9b2a2}.participant.answered{background:#e6eee5}.participant.answered .participantDot{background:var(--ok)}.check{color:var(--ok);font-weight:800}.accessModal{position:fixed;inset:0;background:rgba(74,66,53,.24);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(520px,100%);background:var(--bg);border:2px solid var(--line);border-radius:24px;padding:22px;position:relative}.close{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--muted);font-size:22px;cursor:pointer}.code{font-size:54px;letter-spacing:8px;font-weight:750;text-align:center;color:var(--accent-dark);margin:12px 0 8px}.qr{display:flex;align-items:center;justify-content:center;background:#fff;padding:18px;border-radius:12px;margin:14px auto;width:min(320px,100%)}.qr canvas,.qr img{display:block;max-width:100%;height:auto}.modalNote{text-align:center;color:var(--muted);line-height:1.45}.hidden{display:none!important}
@media(max-width:1000px){.session{grid-template-columns:1fr}.participants{position:static}.participantList{max-height:320px}.questionHead{grid-template-columns:1fr}.question{order:-1;font-size:27px}.options{width:100%}}
@media(max-width:650px){.wrap{padding:16px 12px 26px}.top{align-items:flex-start;flex-direction:column}.title{font-size:23px}.actions{width:100%}.actions .btn{flex:1}.metric{min-width:0;flex:1}.answers{min-height:320px}.barRow{grid-template-columns:1fr}.barTrack{grid-column:1}.question{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div><div class="title" id="sessionTitle">Umfrage</div><div class="subtle" id="connection">Realtime verbindet …</div></div>
<div class="actions"><button class="btn accent" id="accessBtn">Teilnahme</button><button class="btn accent" id="startBtn">Umfrage starten</button><button class="btn" id="restartBtn">Neu starten</button><button class="btn danger" id="stopBtn">Beenden</button></div>
</header>
<div class="metricRow">
<div class="metric"><strong id="participantMetric">0</strong><span>Teilnehmer</span></div>
<div class="metric"><strong id="rateMetric">0%</strong><span>Antwortquote</span></div>
<div class="metric"><strong id="slideMetric">0 / 0</strong><span>Folie</span></div>
</div>
<main class="session">
<section class="main">
<div class="questionHead">
<button class="btn" id="prevBtn">← zurück</button>
<div class="question" id="liveQuestion">Warte …</div>
<button class="btn" id="nextBtn">weiter →</button>
</div>
<div class="options" id="liveOptions"></div>
<div class="answers"><h2 id="answerTitle">Live-Antworten</h2><div class="subtle">Die Ansicht aktualisiert sich automatisch, sobald Schüler antworten.</div><div id="answers"></div></div>
</section>
<aside class="participants">
<div class="partHead"><div><h2>Teilnehmer</h2><div class="partCount" id="participantSummary">0 von 0 beantwortet</div></div></div>
<div class="participantList" id="participantList"></div>
</aside>
</main>
</div>
<div class="accessModal hidden" id="accessModal">
<div class="modal">
<button class="close" id="closeAccess" aria-label="Schließen">×</button>
<div class="modalNote">Teilnahmecode</div>
<div class="code" id="joinCode">------</div>
<div class="qr" id="qrBox"></div>
<div class="modalNote">Schüler scannen den QR-Code und gelangen direkt zur Schülerseite.</div>
</div>
</div>
<script>
const SUPABASE_URL='https://mqtcwiiawmuxrpkjfrfc.supabase.co';
const SUPABASE_KEY='sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let currentSession=null,realtimeChannel=null,participantMap=new Map();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function requireUser(){const {data,error}=await db.auth.getUser();if(error||!data.user){location.href='teacher.html';return null}return data.user}
function setConnection(text){$('connection').textContent=text}
async function load(){const user=await requireUser();if(!user)return;const id=new URLSearchParams(location.search).get('id');if(!id){location.href='dashboard.html';return}const {data,error}=await db.from('sessions').select('*').eq('id',id).single();if(error||!data||data.owner_id!==user.id){location.href='dashboard.html';return}currentSession=data;if(data.status==='ended'){location.href='dashboard.html';return}$('sessionTitle').textContent=data.title||'Umfrage';$('joinCode').textContent=data.join_code||'------';renderSession();await refreshLiveData();subscribe()}
function subscribe(){if(realtimeChannel)db.removeChannel(realtimeChannel);realtimeChannel=db.channel('teacher-live-'+currentSession.id).on('postgres_changes',{event:'*',schema:'public',table:'sessions'},payload=>{if(payload.new&&payload.new.id===currentSession.id){currentSession=payload.new;if(currentSession.status==='ended'){cleanup();location.href='dashboard.html';return}renderSession();refreshLiveData()}}).on('postgres_changes',{event:'*',schema:'public',table:'participants'},payload=>{if(payload.new?.session_id===currentSession.id||payload.old?.session_id===currentSession.id)refreshLiveData()}).on('postgres_changes',{event:'*',schema:'public',table:'responses'},payload=>{if(payload.new?.session_id===currentSession.id||payload.old?.session_id===currentSession.id)refreshLiveData()}).subscribe((status,err)=>{if(status==='SUBSCRIBED')setConnection('Realtime verbunden');else setConnection('Realtime: '+status+(err?.message?' · '+err.message:''))})}
async function cleanup(){if(realtimeChannel){await db.removeChannel(realtimeChannel);realtimeChannel=null}}
function responseValue(r){return r?.answer?.value}
async function refreshLiveData(){if(!currentSession)return;const sid=currentSession.id;const [p,r]=await Promise.all([db.from('participants').select('id,name').eq('session_id',sid).order('joined_at',{ascending:true}),db.from('responses').select('id,participant_id,slide_index,answer,created_at').eq('session_id',sid).order('created_at',{ascending:false})]);if(p.error||r.error){setConnection('Daten konnten nicht geladen werden');return}const participants=p.data||[],responses=r.data||[],idx=currentSession.current_slide||0,currentRows=currentSession.status==='running'?responses.filter(x=>x.slide_index===idx):[],answered=new Set(currentRows.map(x=>x.participant_id));participantMap=new Map(participants.map(x=>[x.id,x.name||'Schüler']));$('participantMetric').textContent=participants.length;$('rateMetric').textContent=(participants.length?Math.round(currentRows.length/participants.length*100):0)+'%';$('participantSummary').textContent=answered.size+' von '+participants.length+' beantwortet';renderParticipants(participants,answered);renderAnswers(currentRows,(currentSession.survey_snapshot||[])[idx]||{})}
function renderParticipants(participants,answered){const root=$('participantList');if(!participants.length){root.innerHTML='<div class="empty">Noch keine Teilnehmer.</div>';return}root.innerHTML=participants.map(p=>'<div class="participant '+(answered.has(p.id)?'answered':'')+'"><span class="participantDot"></span><span>'+esc(p.name||'Schüler')+'</span><span class="check">'+(answered.has(p.id)?'✓':'')+'</span></div>').join('')}
function renderSession(){const slides=currentSession.survey_snapshot||[],i=Number(currentSession.current_slide)||0,f=slides[i]||{},running=currentSession.status==='running';$('slideMetric').textContent=(running&&slides.length?i+1:0)+' / '+slides.length;$('prevBtn').disabled=!running||i<=0;$('nextBtn').disabled=!running||i>=slides.length-1;$('startBtn').classList.toggle('hidden',running);$('restartBtn').disabled=!running;$('liveQuestion').textContent=running?(f.question||'Keine Frage'):'Bereit zum Start';$('liveOptions').innerHTML=running&&['Multiple-Choice','Ranking','Skala'].includes(f.type||'')?(f.options||[]).map(o=>'<div class="option">'+esc(o)+'</div>').join(''):'<div class="empty">'+(running?'':'Die Schüler können jetzt beitreten. Die erste Frage wird erst nach dem Start angezeigt.')+'</div>';$('answerTitle').textContent=running?'Live-Antworten':'Noch keine Live-Antworten';}
function renderAnswers(rows,f){const root=$('answers');root.innerHTML='';if(!rows.length){root.innerHTML='<div class="empty">Noch keine Antworten auf dieser Folie.</div>';return}const t=f.type||'Offene Frage';if(t==='Multiple-Choice')return renderChoices(root,rows,f.options||[]);if(t==='Skala')return renderScale(root,rows,f.options||[]);if(t==='Wortwolke')return renderWords(root,rows);if(t==='Ranking')return renderRanking(root,rows,f.options||[]);if(t==='Pin setzen')return renderPins(root,rows);renderTexts(root,rows)}
function renderChoices(root,rows,options){const counts=new Map(options.map(o=>[o,0]));rows.forEach(r=>{const v=String(responseValue(r));counts.set(v,(counts.get(v)||0)+1)});const max=Math.max(1,rows.length);root.innerHTML=options.map(o=>{const c=counts.get(o)||0;return '<div class="barRow"><div>'+esc(o)+'</div><div class="barTrack"><div class="barFill" style="width:'+Math.round(c/max*100)+'%"></div></div><div><b>'+c+'</b></div></div>'}).join('')}
function renderScale(root,rows,options){const n=Math.max(2,options.length||5),counts=Array(n).fill(0);rows.forEach(r=>{const v=Number(responseValue(r));if(Number.isInteger(v)&&v>=1&&v<=n)counts[v-1]++});root.innerHTML=counts.map((c,i)=>'<div class="barRow"><div><b>'+(i+1)+'</b>'+(options[i]?' · '+esc(options[i]):'')+'</div><div class="barTrack"><div class="barFill" style="width:'+Math.round(c/Math.max(1,rows.length)*100)+'%"></div></div><div><b>'+c+'</b></div></div>').join('')}
function renderWords(root,rows){const words=new Map();rows.forEach(r=>{const v=String(responseValue(r)||'').trim().toLowerCase();v.split(/[^\p{L}\p{N}äöüÄÖÜß'-]+/u).filter(w=>w.length>2).forEach(w=>words.set(w,(words.get(w)||0)+1))});const stop=new Set('und oder der die das ein eine einer eines einem einen ich wir ihr sie er es ist sind war für von mit auf im in zu den dem des dass auch als sich nicht sehr aber wie'.split(' '));const arr=[...words.entries()].filter(([w])=>!stop.has(w)).sort((a,b)=>b[1]-a[1]).slice(0,40);if(!arr.length){root.innerHTML='<div class="empty">Noch keine auswertbaren Wörter.</div>';return}const max=arr[0][1];root.innerHTML='<div class="chipCloud">'+arr.map(([w,c])=>'<span class="chip" style="font-size:'+(15+(c/max)*18).toFixed(0)+'px;opacity:'+(0.55+(c/max)*0.45).toFixed(2)+'">'+esc(w)+' <small>'+c+'</small></span>').join('')+'</div>'}
function renderTexts(root,rows){root.innerHTML=rows.map(r=>'<div class="textAnswer"><div><span class="name">'+esc(participantMap.get(r.participant_id)||'Schüler')+'</span> <span class="time">'+new Date(r.created_at).toLocaleTimeString('de-DE')+'</span></div><div style="margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(String(responseValue(r)??''))+'</div></div>').join('')}
function renderPins(root,rows){root.innerHTML='<div class="pinBoard">'+rows.map(r=>{const v=responseValue(r);if(!v||typeof v.x!=='number'||typeof v.y!=='number')return '';return '<div class="pin" title="Antwort" style="left:'+Math.max(0,Math.min(100,v.x))+'%;top:'+Math.max(0,Math.min(100,v.y))+'%"></div>'}).join('')+'</div>'+rows.map(r=>{const v=responseValue(r);return v?.note?'<div class="textAnswer"><b>Hinweis</b><div style="margin-top:7px">'+esc(v.note)+'</div></div>':''}).join('')}
function renderRanking(root,rows,options){const pos=new Map(options.map(o=>[o,[]]));rows.forEach(r=>{const v=responseValue(r);if(Array.isArray(v))v.forEach((o,i)=>{if(pos.has(o))pos.get(o).push(i+1)})});root.innerHTML=options.map(o=>{const vals=pos.get(o)||[],avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'–';return '<div class="rankRow"><b>'+esc(avg)+'</b><div>'+esc(o)+'</div><div class="subtle">'+vals.length+'x</div></div>'}).join('')}
async function move(delta){const slides=currentSession.survey_snapshot||[],next=Math.max(0,Math.min(slides.length-1,(Number(currentSession.current_slide)||0)+delta));if(next===(Number(currentSession.current_slide)||0))return;const {data,error}=await db.from('sessions').update({current_slide:next,updated_at:new Date().toISOString()}).eq('id',currentSession.id).select().single();if(error){setConnection('Folie konnte nicht geändert werden');return}currentSession=data;renderSession();refreshLiveData()}
async function startSession(){if(currentSession.status==='running')return;const {data,error}=await db.from('sessions').update({status:'running',started_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',currentSession.id).select().single();if(error){setConnection('Umfrage konnte nicht gestartet werden: '+error.message);return}currentSession=data;renderSession();refreshLiveData()}
async function restart(){if(!confirm('Alle bisherigen Antworten dieser Session löschen und wieder bei Folie 1 starten? Die Teilnehmer bleiben erhalten.'))return;const {error}=await db.from('responses').delete().eq('session_id',currentSession.id);if(error){setConnection('Antworten konnten nicht zurückgesetzt werden');return}const {data,error:se}=await db.from('sessions').update({current_slide:0,status:'running',updated_at:new Date().toISOString()}).eq('id',currentSession.id).select().single();if(se){setConnection('Session konnte nicht neu gestartet werden');return}currentSession=data;renderSession();refreshLiveData()}
async function stop(){if(!confirm('Sitzung wirklich beenden und zur Übersicht zurückkehren?'))return;const {error}=await db.from('sessions').update({status:'ended',updated_at:new Date().toISOString()}).eq('id',currentSession.id);if(error){setConnection('Session konnte nicht beendet werden');return}await cleanup();location.href='dashboard.html'}
function openAccess(){ $('joinCode').textContent=currentSession.join_code||'------';$('accessModal').classList.remove('hidden');const box=$('qrBox');box.innerHTML='';const url=new URL('student.html',location.href).href;if(typeof QRCode!=='undefined')new QRCode(box,{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.H})}
function closeAccess(){$('accessModal').classList.add('hidden');$('qrBox').innerHTML=''}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('startBtn').onclick=startSession;$('restartBtn').onclick=restart;$('stopBtn').onclick=stop;$('accessBtn').onclick=openAccess;$('closeAccess').onclick=closeAccess;$('accessModal').onclick=e=>{if(e.target.id==='accessModal')closeAccess()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAccess()});
load();
</script>
</body>
</html>
