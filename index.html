<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchulUmfrage</title>
<style>
:root{--bg:#f1efe6;--surface:#f5f3ea;--line:#93856a;--text:#5b5446;--muted:#90836b;--accent:#918469;--accent-dark:#6d624e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.page{min-height:100vh;padding:40px 0 40px 10.2vw}.label{font-size:30px;line-height:1.1;color:var(--muted);margin:0 0 28px 138px;letter-spacing:.01em}.card{width:418px;min-height:780px;border:2px solid var(--line);border-radius:24px;padding:116px 14px 40px;background:transparent}.question{margin:0 0 24px 2px;font-size:29px;line-height:1.2;font-weight:500;color:var(--muted)}.role{display:flex;align-items:center;justify-content:center;height:148px;border:2px solid var(--line);border-radius:3px;background:rgba(239,236,222,.42);color:#4f4a2c;text-decoration:none;font-size:37px;font-weight:700;margin-bottom:14px;transition:background .16s ease,transform .16s ease}.role:hover,.role:focus-visible{background:#ebe7d8;transform:translateY(-1px);outline:none}.role:active{transform:translateY(0)}@media(max-width:700px){.page{padding:24px 18px}.label{margin:0 0 18px;text-align:center;font-size:24px}.card{width:100%;min-height:0;padding:74px 14px 28px}.question{font-size:25px}.role{height:120px;font-size:32px}}
</style>
</head>
<body>
<main class="page">
  <div class="label">Ernst-Abbe-Gymnasium</div>
  <section class="card" aria-label="Rolle auswählen">
    <h1 class="question">Wähle deine Rolle.</h1>
    <a class="role" href="teacher.html">Lehrer</a>
    <a class="role" href="student.html">Schüler</a>
  </section>
</main>
</body>
</html>
