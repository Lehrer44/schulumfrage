<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchulUmfrage</title>
<style>
:root{--bg:#f1efe6;--surface:#f5f3ea;--line:#93856a;--text:#5b5446;--muted:#90836b;--accent:#918469;--accent-dark:#6d624e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
.page{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(460px,100%);display:flex;flex-direction:column;gap:16px}
.role{display:flex;align-items:center;justify-content:center;min-height:118px;border:2px solid var(--line);border-radius:18px;background:rgba(246,244,236,.58);box-shadow:0 8px 22px rgba(92,85,71,.08);color:var(--text);text-decoration:none;font-size:32px;font-weight:700;letter-spacing:.01em;transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
.role:hover,.role:focus-visible{background:#ebe7d8;box-shadow:0 12px 28px rgba(92,85,71,.14);transform:translateY(-2px);outline:none}
.role:active{transform:translateY(0);box-shadow:0 6px 16px rgba(92,85,71,.09)}
@media(max-width:600px){.page{padding:20px}.card{gap:14px}.role{min-height:100px;font-size:28px;border-radius:16px}}
</style>
</head>
<body>
<main class="page">
  <section class="card" aria-label="Rolle auswählen">
    <a class="role" href="teacher.html">Lehrer</a>
    <a class="role" href="student.html">Schüler</a>
  </section>
</main>
</body>
</html>
