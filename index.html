<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SchulUmfrage</title>
  <style>
    :root{--bg:#0b1020;--panel:#151c31;--a:#7c5cff;--t:#f5f7ff;--m:#9aa6c4;--l:#2b3757}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0b1020,#111a31 55%,#17112d);color:var(--t);font:16px system-ui,sans-serif}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(920px,100%);background:#151c31ee;border:1px solid var(--l);border-radius:24px;padding:32px}
    .brand{font-size:42px;font-weight:900;letter-spacing:-1px}
    .muted{color:var(--m)}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
    .choice{display:block;text-decoration:none;color:inherit;background:#11182b;border:1px solid var(--l);border-radius:18px;padding:24px;transition:.2s}
    .choice:hover{transform:translateY(-2px);border-color:#7c5cff;background:#18213a}
    .icon{font-size:38px;margin-bottom:10px}.title{font-size:24px;font-weight:900}
    .desc{margin-top:8px;color:var(--m);line-height:1.5}
    .hint{margin-top:24px;padding-top:18px;border-top:1px solid var(--l);font-size:14px;color:var(--m)}
    @media(max-width:720px){.choices{grid-template-columns:1fr}.card{padding:24px}.brand{font-size:34px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="brand">SchulUmfrage</div>
      <p class="muted">Interaktive Umfragen für den Unterricht.</p>
      <div class="choices">
        <a class="choice" href="teacher.html">
          <div class="icon">🔒</div>
          <div class="title">Lehrerbereich</div>
          <div class="desc">Umfragen erstellen, bearbeiten, starten und Live-Antworten ansehen.</div>
        </a>
        <a class="choice" href="student.html">
          <div class="icon">👩‍🎓</div>
          <div class="title">Schülerbereich</div>
          <div class="desc">Namen eingeben und an einer laufenden Umfrage teilnehmen.</div>
        </a>
      </div>
      <div class="hint">Der Lehrerbereich wird zusätzlich durch den Supabase-Login geschützt.</div>
    </section>
  </main>
</body>
</html>
